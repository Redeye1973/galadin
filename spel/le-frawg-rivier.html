<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Le Frawg Rivier</title>
<style>

:root {
  --grond: #0c2624; --paneel: rgba(9, 36, 34, 0.9); --lijn: #2f6a5f;
  --inkt: #fff6e0; --inkt2: #b9d8cc; --goud: #ffd24d; --goud-inkt: #2b2106; --rood: #ff6b5e;
  --kop: "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", sans-serif;
  --tekst: Roboto, "sans-serif", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--grond); color: var(--inkt); font: 15px/1.4 var(--tekst); overscroll-behavior: none; overflow: hidden; }
body { user-select: none; -webkit-user-select: none; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--goud); outline-offset: 2px; }
h1, h2 { font-family: var(--kop); font-weight: 700; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }

#spel { position: fixed; inset: 0; display: grid; place-items: center; }
.kader { position: relative; }
#rivier { display: block; touch-action: none; }


.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 12px;
  padding: 8px 10px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px));
  background: linear-gradient(rgba(4, 22, 20, 0.62), rgba(4, 22, 20, 0)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.hartjes { display: flex; gap: 3px; flex: 1; }
.hartjes img { width: 24px; height: 22px; transition: opacity .3s, filter .3s; }
.hartjes img.leeg { opacity: 0.35; filter: grayscale(1) brightness(0.7); }
.hartjes img.erbij { animation: erbij .6s ease-out; }
@keyframes erbij { 0% { transform: scale(1.8); } 100% { transform: scale(1); } }
.teller { display: flex; align-items: baseline; gap: 3px; font: 700 22px/1 var(--kop); font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 0 #06201c, 0 0 4px rgba(0, 0, 0, 0.5); }
.teller small { font-size: 14px; color: var(--inkt2); }
.teller img { width: 18px; height: 13px; align-self: center; }
.rond { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(9, 36, 34, 0.7); border: 1px solid var(--lijn); }
.rond svg { width: 18px; height: 18px; fill: var(--inkt); }

.hint { position: absolute; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); margin: 0; text-align: center; font: 700 17px var(--kop);
  color: var(--inkt); text-shadow: 0 1px 0 #06201c, 0 0 6px rgba(0, 0, 0, 0.6); animation: klop 1.4s ease-in-out infinite; pointer-events: none; }
@keyframes klop { 50% { opacity: 0.55; } }


.scherm { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(4, 22, 20, 0.45); z-index: 5; }
.paneel { width: min(340px, 100%); max-height: 100%; overflow-y: auto; background: var(--paneel); border: 1px solid var(--lijn);
  border-radius: 18px; padding: 20px 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); text-align: center; }
.kikker-groot { width: 112px; height: 104px; margin-top: -4px; }
h1 { font-size: 38px; line-height: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
h1 span { font-size: 22px; color: var(--goud); letter-spacing: 0.18em; text-transform: uppercase; }
h2 { font-size: 30px; line-height: 1.1; }
.uitleg { list-style: none; margin: 2px 0; padding: 0; display: grid; gap: 7px; width: 100%; text-align: left; font-size: 15px; }
.uitleg li { display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 8px; }
.uitleg img { width: 32px; height: 32px; object-fit: contain; justify-self: center; padding: 3px; border-radius: 50%; background: #1f8f7e; }
.hoofdknop { width: 100%; padding: 14px 16px; border-radius: 14px; background: var(--goud); color: var(--goud-inkt);
  font: 700 20px var(--kop); box-shadow: 0 3px 0 #b38a12; }
.hoofdknop:active { transform: translateY(2px); box-shadow: 0 1px 0 #b38a12; }
.tweede { width: 100%; padding: 11px 16px; border-radius: 14px; border: 1px solid var(--lijn); font: 700 17px var(--kop); color: var(--inkt); }
.beste { margin: 0; color: var(--inkt2); font-size: 14px; min-height: 1em; }
.beste:empty { display: none; }
.uitslag { margin: 0; font: 400 18px var(--kop); color: var(--inkt2); }
.uitslag b { display: block; font-size: 58px; line-height: 1; color: var(--inkt); font-variant-numeric: tabular-nums; }
.regel { margin: 0; font-size: 16px; }
.klein { margin: 0; font-size: 13px; color: var(--inkt2); }
.klein:empty { display: none; }
.schakels { display: flex; gap: 8px; width: 100%; }
.schakel { flex: 1; padding: 8px 6px; border-radius: 999px; border: 1px solid var(--lijn); font-size: 13px; color: var(--inkt2); }
.schakel[aria-pressed="true"] { color: var(--inkt); background: rgba(47, 106, 95, 0.45); }


#studio { --gw: min(96vw, 66vh); position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: rgb(8,11,53) linear-gradient(to bottom, rgb(4,5,31) 0%, rgb(6,7,44) calc(50% + var(--gw) * -0.5195), rgb(7,8,46) calc(50% + var(--gw) * -0.4330), rgb(7,9,49) calc(50% + var(--gw) * -0.3463), rgb(8,10,50) calc(50% + var(--gw) * -0.2598), rgb(8,11,52) calc(50% + var(--gw) * -0.1732), rgb(8,11,53) calc(50% + var(--gw) * -0.0866), rgb(8,11,53) calc(50% + var(--gw) * 0.0000), rgb(8,11,52) calc(50% + var(--gw) * 0.0866), rgb(8,10,50) calc(50% + var(--gw) * 0.1732), rgb(7,9,49) calc(50% + var(--gw) * 0.2598), rgb(7,8,47) calc(50% + var(--gw) * 0.3463), rgb(6,7,44) calc(50% + var(--gw) * 0.4330), rgb(5,6,42) calc(50% + var(--gw) * 0.5195), rgb(4,5,31) 100%); transition: opacity .45s ease; }
#studio.weg { opacity: 0; pointer-events: none; }
#studio img { display: block; width: var(--gw); height: auto; animation: studioIn .5s ease both; }
@keyframes studioIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }

</style>
</head>

const STUDIO_KLAAR = new Promise((klaar) => {
  const el = document.getElementById('studio');
  if (!el) { klaar(); return; }
  let weg = false;
  const sluit = () => { if (weg) return; weg = true; el.classList.add('weg'); setTimeout(() => { el.remove(); klaar(); }, 450); };
  el.addEventListener('click', sluit);

const SPRITE_GEO={"kikker": [20, 19], "kikker_voor": [24, 20], "kikker_groot": [28, 26], "blad_groot": [36, 36], "blad_bloem": [40, 38], "blad_klein": [24, 24], "blad_geel": [15, 14], "blad_groen": [17, 17], "stam": [48, 16], "vlieg": [13, 9], "wesp": [21, 17], "libel": [24, 23], "hartje": [20, 18]};




const W = 180;
const OEVER_L = 26, OEVER_R = 154;
const TEGEL = 32, TEGEL_X0 = -22;


function maakRng(zaad) {
  let a = zaad >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const klem = (v, a, b) => (v < a ? a : v > b ? b : v);
const tussen = (a, b, t) => a + (b - a) * t;
const afstand = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function kies(rng, gewichten) {

  let som = 0;
  for (const k in gewichten) som += gewichten[k];
  let u = rng() * som;
  for (const k in gewichten) { u -= gewichten[k]; if (u <= 0) return k; }
  return Object.keys(gewichten)[0];
}




const BEELD = {};
const MATEN = typeof SPRITE_GEO !== 'undefined' ? SPRITE_GEO : {};

function laadBeelden() {
  const namen = Object.keys(typeof SPRITE_BRON !== 'undefined' ? SPRITE_BRON : {});
  return Promise.all(namen.map((n) => new Promise((klaar) => {
    const im = new Image();
    im.onload = () => { BEELD[n] = im; klaar(); };
    im.onerror = () => { console.warn('beeld laadt niet:', n); klaar(); };
    im.src = SPRITE_BRON[n];

  }))).then(() => (typeof STUDIO_KLAAR !== 'undefined' ? STUDIO_KLAAR : null));
}












const BLADEN = {
  groot: { r: 17, beeld: 'blad_groot' },
  bloem: { r: 18, beeld: 'blad_bloem' },
  klein: { r: 11, beeld: 'blad_klein' },
  geel: { r: 7, beeld: 'blad_geel', zinkt: true },
  groen: { r: 8, beeld: 'blad_groen', zinkt: true },
  stam: { hw: 23, hh: 7, beeld: 'stam' },
};
const KIKKER_R = 8;
const SPRONG_MAX = 62;
const TONG_MAX = 52;
const HARTJES = 3, ONKWETSBAAR = 1.6;
const VLIEGEN_PER_HARTJE = 25;




const moeite = (s) => klem(s.meters / 900, 0, 1);
const stroom = (s) => 10 + 13 * moeite(s);

function nieuwSpel(zaad, hoogte) {
  const s = {
    rng: maakRng(zaad), zaad, H: hoogte || 390, t: 0, camY: 0, meters: 0, besteY: 0,
    bladen: [], vliegen: [], wespen: [], libellen: [], gebeurd: [], volgendId: 1, bovensteRij: 0,
    kikker: null, hartjes: HARTJES, onkwetsbaarTot: 0, vliegenGevangen: 0, combo: 0, laatsteVangst: -9,
    volgendeWesp: 20, volgendeLibel: 30, klaar: false, begonnen: false, oorzaak: {}, startY: 60, rijBladen: [],
  };

  const start = maakBlad(s, 'groot', W / 2, 60, 0);
  s.bovensteRij = 60;
  s.rijBladen = [start.id];
  vulRijen(s);
  s.kikker = { staat: 'zit', blad: start.id, x: start.x, y: start.y, ox: 0, richting: 0, sprong: null, tong: null, plons: 0, wachtrij: null };
  return s;
}

function maakBlad(s, soort, x, y, vx) {
  const b = { id: s.volgendId++, soort, x, y, vx, draai: s.rng() * Math.PI * 2, draaiV: (s.rng() - 0.5) * 0.3, zinkStart: null, weg: false };
  s.bladen.push(b);
  return b;
}

function bladBinnen(b, x, y, marge) {
  const d = BLADEN[b.soort];
  if (d.hw) return Math.abs(x - b.x) <= d.hw + marge && Math.abs(y - b.y) <= d.hh + marge;
  return afstand(x, y, b.x, b.y) <= d.r + marge;
}
const bladStraal = (b) => BLADEN[b.soort].r || BLADEN[b.soort].hw;





function vulRijen(s) {
  const k = moeite(s);
  while (s.bovensteRij < s.camY + s.H + 80) {
    const vorige = s.bladen.filter((b) => !b.weg && s.rijBladen.includes(b.id));
    const dy = 30 + s.rng() * (12 + 8 * k);
    const y = s.bovensteRij + dy;
    const aantal = s.rng() < 0.25 - 0.1 * k ? 3 : s.rng() < 0.75 ? 2 : 1;
    const gewicht = { groot: 0.42 - 0.2 * k, bloem: 0.14 - 0.04 * k, klein: 0.26 + 0.04 * k, geel: 0.07 + 0.12 * k, groen: 0.06 + 0.1 * k, stam: 0.05 + 0.03 * k };
    const nieuw = [];
    for (let i = 0; i < aantal; i++) {
      let soort = kies(s.rng, gewicht);
      let x = null;
      for (let poging = 0; poging < 12 && x == null; poging++) {
        const r = BLADEN[soort].r || BLADEN[soort].hw;
        const kx = OEVER_L + r + 2 + s.rng() * (OEVER_R - OEVER_L - 2 * r - 4);
        if (nieuw.every((n) => Math.abs(n.x - kx) > bladStraal(n) + r + 6)) x = kx;
      }
      if (x == null) continue;

      nieuw.push(maakBlad(s, soort, x, y + (s.rng() - 0.5) * 6, (s.rng() - 0.5) * 5));
    }

    const bereik = (a, b) => afstand(a.x, a.y, b.x, b.y) <= SPRONG_MAX * 0.85;
    const veilig = (b) => !BLADEN[b.soort].zinkt;
    if (vorige.length && !nieuw.some((n) => veilig(n) && vorige.some((v) => bereik(v, n)))) {
      const v = vorige[Math.floor(s.rng() * vorige.length)];
      const x = klem(v.x + (s.rng() - 0.5) * 50, OEVER_L + 20, OEVER_R - 20);
      nieuw.push(maakBlad(s, 'groot', x, v.y + Math.min(dy, SPRONG_MAX * 0.7), (s.rng() - 0.5) * 6));
    }
    s.bovensteRij = y;
    s.rijBladen = nieuw.map((n) => n.id);
  }
}

function gebeur(s, soort, x, y, extra) { s.gebeurd.push(Object.assign({ soort, x, y }, extra || {})); }


function tik(s, x, y) {
  const kk = s.kikker;
  if (s.klaar || kk.staat === 'plons') return;

  if (kk.staat === 'zit' && !kk.tong) {
    let beste = null, bestD = 1e9;
    for (const v of s.vliegen) {
      const d = afstand(x, y, v.x, v.y);
      if (d < 12 && d < bestD) { beste = v; bestD = d; }
    }
    if (beste) {
      if (afstand(kk.x, kk.y, beste.x, beste.y) <= TONG_MAX) { kk.tong = { vlieg: beste, t: 0, x: kk.x, y: kk.y }; gebeur(s, 'tong', kk.x, kk.y); }
      else gebeur(s, 'te_ver', x, y);
      return;
    }
  }

  let doel = null, bestD = 1e9;
  for (const b of s.bladen) {
    if (b.weg || b.id === kk.blad) continue;
    if (bladBinnen(b, x, y, 6)) { const d = afstand(x, y, b.x, b.y); if (d < bestD) { doel = b; bestD = d; } }
  }
  if (!doel) { gebeur(s, 'rimpel', x, y); return; }
  if (kk.staat === 'sprong' || kk.tong) { kk.wachtrij = { blad: doel.id, dx: x - doel.x }; return; }
  springNaar(s, doel, x - doel.x);
}

function springNaar(s, doel, dx) {
  const kk = s.kikker;
  if (afstand(kk.x, kk.y, doel.x, doel.y) > SPRONG_MAX + bladStraal(doel) * 0.4) { gebeur(s, 'te_ver', doel.x, doel.y); return false; }
  const d = afstand(kk.x, kk.y, doel.x, doel.y), T = 0.3 + d / 450;

  const ox = BLADEN[doel.soort].hw ? klem(dx, -BLADEN[doel.soort].hw + 6, BLADEN[doel.soort].hw - 6) : 0;
  const x1 = doel.x + doel.vx * T + ox, y1 = doel.y - stroom(s) * T;
  kk.sprong = { x0: kk.x, y0: kk.y, x1, y1, t: 0, T, blad: doel.id, ox };
  kk.richting = Math.atan2(x1 - kk.x, y1 - kk.y);
  kk.staat = 'sprong';
  kk.blad = null;
  s.begonnen = true;
  gebeur(s, 'sprong', kk.x, kk.y);
  return true;
}

function raak(s, oorzaak) {
  if (s.t < s.onkwetsbaarTot || s.klaar) return false;
  s.hartjes--;
  s.oorzaak[oorzaak] = (s.oorzaak[oorzaak] || 0) + 1;
  s.onkwetsbaarTot = s.t + ONKWETSBAAR;
  gebeur(s, 'au', s.kikker.x, s.kikker.y, { oorzaak });
  if (s.hartjes <= 0) { s.klaar = true; gebeur(s, 'klaar', s.kikker.x, s.kikker.y); }
  return true;
}




function herstart(s) {
  const kk = s.kikker, lijn = s.camY + s.H * 0.28;
  let beste = null, bestD = 1e9;
  for (const b of s.bladen) {
    if (b.weg || BLADEN[b.soort].zinkt || b.soort === 'stam') continue;
    if (b.y > lijn + 4 || b.y < s.camY + s.H * 0.1) continue;
    const d = Math.abs(b.y - lijn) + Math.abs(b.x - W / 2) * 0.5;
    if (d < bestD) { beste = b; bestD = d; }
  }
  if (!beste || bestD > 60) beste = maakBlad(s, 'groot', W / 2, lijn, 0);
  Object.assign(kk, { staat: 'zit', blad: beste.id, x: beste.x, y: beste.y, ox: 0, sprong: null, tong: null, wachtrij: null, plons: 0 });
  s.onkwetsbaarTot = Math.max(s.onkwetsbaarTot, s.t + ONKWETSBAAR);
}

function stap(s, dt) {
  if (s.klaar || !s.begonnen) return;
  s.t += dt;
  const v = stroom(s), k = moeite(s), kk = s.kikker;
  s.bovensteRij -= v * dt;
  s.vloed = (s.vloed || 0) + v * dt;

  for (const b of s.bladen) {
    if (b.weg) continue;
    b.y -= v * dt;
    b.x += b.vx * dt;
    const r = bladStraal(b);
    if (b.x < OEVER_L + r) { b.x = OEVER_L + r; b.vx = Math.abs(b.vx); }
    if (b.x > OEVER_R - r) { b.x = OEVER_R - r; b.vx = -Math.abs(b.vx); }
    b.draai += b.draaiV * dt;
    if (b.zinkStart != null && s.t - b.zinkStart > zinkTijd(s)) { b.weg = true; gebeur(s, 'zinkt', b.x, b.y); }
    if (b.y < s.camY - 60) b.weg = true;
  }
  s.bladen = s.bladen.filter((b) => !b.weg);

  if (kk.staat === 'zit') {
    const b = s.bladen.find((q) => q.id === kk.blad);
    if (!b) { plons(s, 'gezonken'); }
    else {
      kk.x = b.x + (kk.ox || 0); kk.y = b.y;
      if (kk.y < s.camY - 6) { gebeur(s, 'meegesleurd', kk.x, kk.y); raak(s, 'stroom'); if (!s.klaar) herstart(s); }
    }
  } else if (kk.staat === 'sprong') {
    const p = kk.sprong;
    p.t += dt;
    const f = klem(p.t / p.T, 0, 1);
    kk.x = tussen(p.x0, p.x1, f); kk.y = tussen(p.y0, p.y1, f);
    if (f >= 1) {
      const b = s.bladen.find((q) => q.id === p.blad && !q.weg);
      if (b && bladBinnen(b, kk.x, kk.y, 4)) {
        Object.assign(kk, { staat: 'zit', blad: b.id, sprong: null, ox: p.ox });
        if (BLADEN[b.soort].zinkt && b.zinkStart == null) b.zinkStart = s.t;
        gebeur(s, 'land', kk.x, kk.y, { soort: b.soort });
        if (kk.wachtrij) {
          const w = kk.wachtrij; kk.wachtrij = null;
          const d = s.bladen.find((q) => q.id === w.blad && !q.weg);
          if (d) springNaar(s, d, w.dx);
        }
      } else plons(s, 'mis');
    }
  } else if (kk.staat === 'plons') {
    kk.plons -= dt;
    if (kk.plons <= 0) herstart(s);
  }

  if (kk.tong) {
    const tg = kk.tong, vl = tg.vlieg;
    tg.t += dt;
    if (tg.t <= 0.12) { tg.x = tussen(kk.x, vl.x, tg.t / 0.12); tg.y = tussen(kk.y, vl.y, tg.t / 0.12); }
    if (tg.t > 0.12 && !tg.klaar) {
      tg.klaar = true;
      if (!vl.weg && afstand(kk.x, kk.y, vl.x, vl.y) <= TONG_MAX + 6) {
        vl.weg = true; vl.gevangen = true;
        s.vliegenGevangen++;
        s.combo = s.t - s.laatsteVangst < 2.5 ? s.combo + 1 : 1;
        s.laatsteVangst = s.t;
        gebeur(s, 'vang', vl.x, vl.y, { combo: s.combo });
        if (s.vliegenGevangen % VLIEGEN_PER_HARTJE === 0 && s.hartjes < HARTJES) { s.hartjes++; gebeur(s, 'hartje', kk.x, kk.y); }
      } else gebeur(s, 'mis', vl.x, vl.y);
    }
    if (tg.klaar) { const f = klem((tg.t - 0.12) / 0.14, 0, 1); tg.x = tussen(vl.x, kk.x, f); tg.y = tussen(vl.y, kk.y, f); }
    if (tg.t >= 0.26) {
      kk.tong = null;
      if (kk.wachtrij && kk.staat === 'zit') {
        const w = kk.wachtrij; kk.wachtrij = null;
        const d = s.bladen.find((q) => q.id === w.blad && !q.weg);
        if (d) springNaar(s, d, w.dx);
      }
    }
  }

  s.camY = Math.max(s.camY, kk.y - s.H * 0.28);
  s.besteY = Math.max(s.besteY, kk.y);
  s.meters = Math.max(0, Math.floor((s.besteY - s.startY) / 10));
  vulRijen(s);
  werkVliegenBij(s, dt, v);
  werkWespenBij(s, dt, k);
  werkLibellenBij(s, dt, k);
  s.bladen = s.bladen.filter((b) => !b.weg);
}

const zinkTijd = (s) => 2.8 - 1.2 * moeite(s);

function plons(s, oorzaak) {
  const kk = s.kikker;
  gebeur(s, 'plons', kk.x, kk.y);
  Object.assign(kk, { staat: 'plons', plons: 0.8, sprong: null, tong: null, wachtrij: null, blad: null });
  raak(s, oorzaak);
}

function werkVliegenBij(s, dt, v) {
  for (const f of s.vliegen) {
    f.leeft += dt;
    f.fase += dt * f.snel;
    f.cy -= v * 0.25 * dt;
    f.cx = klem(f.cx + Math.sin(f.fase * 0.37) * 6 * dt, OEVER_L + 6, OEVER_R - 6);
    f.x = f.cx + Math.cos(f.fase) * f.r;
    f.y = f.cy + Math.sin(f.fase * 1.3) * f.r * 0.7;
    if (f.leeft > f.leven || f.y < s.camY - 10) f.weg = true;
  }
  s.vliegen = s.vliegen.filter((f) => !f.weg);
  while (s.vliegen.length < 3) {
    const cx = OEVER_L + 14 + s.rng() * (OEVER_R - OEVER_L - 28), cy = s.camY + s.H * (0.35 + s.rng() * 0.55);
    s.vliegen.push({ id: s.volgendId++, cx, cy, x: cx, y: cy, r: 4 + s.rng() * 6, fase: s.rng() * 6, snel: 2 + s.rng() * 2, leeft: 0, leven: 8 + s.rng() * 5 });
  }
}





function werkWespenBij(s, dt, k) {
  const kk = s.kikker;
  if (s.t > s.volgendeWesp) {
    s.volgendeWesp = s.t + (10 - 6 * k) * (0.7 + s.rng() * 0.6);
    const x = OEVER_L + s.rng() * (OEVER_R - OEVER_L);
    s.wespen.push({ id: s.volgendId++, x, y: s.camY + s.H + 12, vx: 0, vy: -20, t: 0, weg: false, fase: 'nader' });
    gebeur(s, 'wesp', x, s.camY + s.H);
  }
  const snel = 26 + 14 * k;
  for (const w of s.wespen) {
    w.t += dt;
    if (w.fase === 'nader') {
      if (w.t < 1.8) {
        const dx = kk.x - w.x, dy = kk.y - w.y, d = Math.hypot(dx, dy) || 1;
        const gx = (dx / d) * snel, gy = (dy / d) * snel, a = 22 * dt;
        w.vx += klem(gx - w.vx, -a, a); w.vy += klem(gy - w.vy, -a, a);
      }
      if (w.t > 5.5 || w.y < kk.y - 28) w.fase = 'weg';
    } else { w.vy -= 40 * dt; w.vx *= 1 - dt; }
    w.x += w.vx * dt; w.y += w.vy * dt;
    if (w.fase === 'nader' && kk.staat !== 'plons' && afstand(w.x, w.y, kk.x, kk.y) < KIKKER_R + 4) { if (raak(s, 'wesp')) w.fase = 'weg'; }
    if (w.y < s.camY - 30 || w.y > s.camY + s.H + 60 || w.x < -30 || w.x > W + 30) w.weg = true;
  }
  s.wespen = s.wespen.filter((w) => !w.weg);
}


function werkLibellenBij(s, dt, k) {
  const kk = s.kikker;
  if (s.t > s.volgendeLibel) {
    s.volgendeLibel = s.t + (13 - 7.5 * k) * (0.7 + s.rng() * 0.6);
    const links = s.rng() < 0.5, y = s.camY + s.H * (0.35 + s.rng() * 0.5);
    s.libellen.push({ id: s.volgendId++, x: links ? -24 : W + 24, y, y0: y, vx: (links ? 1 : -1) * (70 + 25 * k), t: 0, stil: 0, stilGehad: false, aankondiging: 0.7, weg: false });
    gebeur(s, 'libel', links ? 0 : W, y);
  }
  for (const l of s.libellen) {
    if (l.aankondiging > 0) { l.aankondiging -= dt; continue; }
    l.t += dt;
    if (!l.stilGehad && Math.abs(l.x - W / 2) < 40 && s.rng() < dt * 1.5) { l.stil = 0.5 + s.rng() * 0.4; l.stilGehad = true; }
    if (l.stil > 0) l.stil -= dt; else l.x += l.vx * dt;
    l.y0 -= stroom(s) * 0.15 * dt;
    l.y = l.y0 + Math.sin(l.t * 7) * 3;
    if (kk.staat !== 'plons' && afstand(l.x, l.y, kk.x, kk.y) < KIKKER_R + 4) raak(s, 'libel');
    if (l.x < -40 || l.x > W + 40) l.weg = true;
  }
  s.libellen = s.libellen.filter((l) => !l.weg);
}






const Beeld = { cv: null, ctx: null, H: 390, deeltjes: [], landT: -9, schok: 0 };

const naarScherm = (s, wy) => Beeld.H - (wy - s.camY);
const naarWereld = (s, sy) => s.camY + (Beeld.H - sy);

function tekenSprite(naam, x, y, opts) {
  const im = BEELD[naam];
  if (!im) return;
  const c = Beeld.ctx, o = opts || {};
  c.save();
  c.translate(Math.round(x), Math.round(y));
  if (o.draai) c.rotate(o.draai);
  if (o.sx || o.sy) c.scale(o.sx || 1, o.sy || 1);
  if (o.alfa != null) c.globalAlpha = o.alfa;
  c.drawImage(im, -im.width / 2, -im.height / 2);
  c.restore();
}

function tekenRivier(s) {
  const c = Beeld.ctx, H = Beeld.H;
  const kolommen = ['bbbb', 'bobo', 'oooo', 'oooo', 'oooo', 'obob', 'bbbb'];
  const vloed = (s.vloed || 0) % TEGEL;
  const eerste = Math.floor(s.camY / TEGEL) * TEGEL;
  for (let wy = eerste - TEGEL; wy < s.camY + H + TEGEL; wy += TEGEL) {
    const sy = Math.round(H - (wy - s.camY) - TEGEL);
    kolommen.forEach((code, i) => {
      const im = BEELD['tegels/tegel_' + code];
      if (!im) return;

      const extra = code === 'oooo' ? Math.round(vloed) : 0;
      c.drawImage(im, TEGEL_X0 + i * TEGEL, sy + extra);
    });
  }
}

function tekenBlad(s, b) {
  const d = BLADEN[b.soort], sy = naarScherm(s, b.y);
  if (sy < -40 || sy > Beeld.H + 40) return;
  let alfa = 1, schaal = 1, wiebel = 0;
  if (b.zinkStart != null) {
    const f = klem((s.t - b.zinkStart) / zinkTijd(s), 0, 1);
    alfa = 1 - 0.65 * f; schaal = 1 - 0.25 * f; wiebel = Math.sin(s.t * 22) * 0.18 * f;
  }
  tekenSprite(d.beeld, b.x, sy, { draai: b.soort === 'stam' ? wiebel : b.draai + wiebel, sx: schaal, sy: schaal, alfa });
}

function tekenKikker(s, nu) {
  const kk = s.kikker, c = Beeld.ctx;
  if (kk.staat === 'plons') return;
  const onkwetsbaar = s.t < s.onkwetsbaarTot;
  if (onkwetsbaar && Math.floor(nu / 90) % 2 === 0) return;
  let hoog = 0, schaal = 1;
  if (kk.staat === 'sprong') {
    const f = klem(kk.sprong.t / kk.sprong.T, 0, 1);
    hoog = Math.sin(Math.PI * f) * 7; schaal = 1 + Math.sin(Math.PI * f) * 0.35;
  }
  const x = kk.x, sy = naarScherm(s, kk.y);

  c.save();
  c.globalAlpha = kk.staat === 'sprong' ? 0.22 : 0.18;
  c.fillStyle = '#0b2a2c';
  c.beginPath(); c.ellipse(Math.round(x), Math.round(sy + 3), 7, 4, 0, 0, Math.PI * 2); c.fill();
  c.restore();

  const sinds = nu - Beeld.landT, net = sinds >= 0 && sinds < 120;
  const sx = net ? 1.14 : 1, syk = net ? 0.86 : 1;
  tekenSprite('kikker', x, sy - hoog, { draai: kk.richting, sx: schaal * sx, sy: schaal * syk });
}

function tekenTong(s) {
  const kk = s.kikker, tg = kk.tong;
  if (!tg) return;
  const c = Beeld.ctx, sx = kk.x + Math.sin(kk.richting) * 6, sy = naarScherm(s, kk.y) - Math.cos(kk.richting) * 6;
  const tx = tg.x, ty = naarScherm(s, tg.y);
  c.save();
  c.strokeStyle = '#e8708c'; c.lineWidth = 2; c.lineCap = 'round';
  c.beginPath(); c.moveTo(sx, sy); c.lineTo(tx, ty); c.stroke();
  c.fillStyle = '#f08aa3'; c.beginPath(); c.arc(tx, ty, 2, 0, Math.PI * 2); c.fill();
  c.restore();
}

function tekenInsecten(s, nu) {
  for (const f of s.vliegen) {
    const sy = naarScherm(s, f.y);
    tekenSprite('vlieg', f.x, sy, { sy: Math.floor(nu / 40) % 2 ? 0.8 : 1 });
  }
  for (const w of s.wespen) {
    const sy = naarScherm(s, w.y);

    const richting = Math.atan2(w.vx, w.vy);
    tekenSprite('wesp', w.x, sy, { draai: richting, sx: Math.floor(nu / 35) % 2 ? 0.85 : 1 });
  }
  const c = Beeld.ctx;
  for (const l of s.libellen) {
    const sy = naarScherm(s, l.y);
    if (l.aankondiging > 0) {


      const rechts = l.x > W / 2, x = rechts ? W - 9 : 9, p = rechts ? 1 : -1;
      c.save();
      c.globalAlpha = 0.75 + 0.25 * Math.sin(nu / 60);
      c.fillStyle = '#7fd8ff'; c.strokeStyle = '#0b2a3c'; c.lineWidth = 1.5; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(x + 6 * p, sy - 8); c.lineTo(x - 6 * p, sy); c.lineTo(x + 6 * p, sy + 8); c.closePath();
      c.stroke(); c.fill();
      c.restore();
      continue;
    }
    tekenSprite('libel', l.x, sy, { draai: l.vx > 0 ? Math.PI / 2 : -Math.PI / 2, alfa: 0.92 + 0.08 * Math.sin(nu / 30) });
  }
}



function maakDeeltjes(s, nu) {
  for (const g of s.gebeurd) {
    const sy = naarScherm(s, g.y);
    if (g.soort === 'plons') for (let i = 0; i < 3; i++) Beeld.deeltjes.push({ soort: 'kring', x: g.x, wy: g.y, t0: nu + i * 120, leven: 700 });
    else if (g.soort === 'rimpel') Beeld.deeltjes.push({ soort: 'kring', x: g.x, wy: g.y, t0: nu, leven: 450, klein: true });
    else if (g.soort === 'vang') {
      for (let i = 0; i < 5; i++) Beeld.deeltjes.push({ soort: 'ster', x: g.x, wy: g.y, vx: (Math.random() - 0.5) * 40, vy: 20 + Math.random() * 30, t0: nu, leven: 500 });
      Beeld.deeltjes.push({ soort: 'tekst', x: g.x, wy: g.y, tekst: g.combo > 1 ? 'x' + g.combo : '+1', t0: nu, leven: 700 });
    } else if (g.soort === 'te_ver') Beeld.deeltjes.push({ soort: 'kruis', x: g.x, wy: g.y, t0: nu, leven: 450 });
    else if (g.soort === 'land') Beeld.landT = nu;
    else if (g.soort === 'au') Beeld.schok = nu;
    else if (g.soort === 'zinkt') for (let i = 0; i < 4; i++) Beeld.deeltjes.push({ soort: 'bel', x: g.x + (Math.random() - 0.5) * 8, wy: g.y, t0: nu + i * 90, leven: 600 });
    void sy;
  }
}

function tekenDeeltjes(s, nu) {
  const c = Beeld.ctx;
  Beeld.deeltjes = Beeld.deeltjes.filter((d) => nu - d.t0 < d.leven);
  for (const d of Beeld.deeltjes) {
    const f = (nu - d.t0) / d.leven;
    if (f < 0) continue;
    const sy = naarScherm(s, d.wy);
    c.save();
    if (d.soort === 'kring') {
      c.globalAlpha = 0.7 * (1 - f); c.strokeStyle = '#d8f6f2'; c.lineWidth = 1;
      c.beginPath(); c.ellipse(d.x, sy, (d.klein ? 3 : 5) + f * (d.klein ? 6 : 14), ((d.klein ? 3 : 5) + f * (d.klein ? 6 : 14)) * 0.6, 0, 0, Math.PI * 2); c.stroke();
    } else if (d.soort === 'ster') {
      const t = (nu - d.t0) / 1000;
      c.globalAlpha = 1 - f; c.fillStyle = '#ffe36b';
      c.fillRect(Math.round(d.x + d.vx * t), Math.round(sy - d.vy * t), 2, 2);
    } else if (d.soort === 'tekst') {
      c.globalAlpha = 1 - f; c.fillStyle = '#fff6c8'; c.strokeStyle = '#1b3a1f'; c.lineWidth = 2;
      c.font = 'bold 9px sans-serif'; c.textAlign = 'center';
      c.strokeText(d.tekst, d.x, sy - 8 - f * 12); c.fillText(d.tekst, d.x, sy - 8 - f * 12);
    } else if (d.soort === 'kruis') {
      c.globalAlpha = 1 - f; c.strokeStyle = '#ff6b5e'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(d.x - 4, sy - 4); c.lineTo(d.x + 4, sy + 4); c.moveTo(d.x + 4, sy - 4); c.lineTo(d.x - 4, sy + 4); c.stroke();
    } else if (d.soort === 'bel') {
      c.globalAlpha = 0.8 * (1 - f); c.strokeStyle = '#e6fbff'; c.lineWidth = 1;
      c.beginPath(); c.arc(d.x, sy - f * 6, 1.5, 0, Math.PI * 2); c.stroke();
    }
    c.restore();
  }
}

function tekenAlles(s, nu) {
  const c = Beeld.ctx;
  c.save();

  const sinds = nu - Beeld.schok;
  const schok = sinds >= 0 && sinds < 180 ? (Math.random() - 0.5) * 3 : 0;
  c.translate(schok, 0);
  tekenRivier(s);
  const bladen = s.bladen.slice().sort((a, b) => (a.soort === 'stam') - (b.soort === 'stam'));
  for (const b of bladen) tekenBlad(s, b);
  tekenDeeltjes(s, nu);
  tekenKikker(s, nu);
  tekenTong(s);
  tekenInsecten(s, nu);
  c.restore();

  if (sinds >= 0 && sinds < 260) {
    c.save(); c.globalAlpha = 0.28 * (1 - sinds / 260); c.fillStyle = '#ff4b3e';
    c.fillRect(0, 0, W, Beeld.H); c.restore();
  }
}







const Instelling = { geluid: true, trillen: true };







const MEESTER = 1.6;
let AC = null, HOOFD = null;

function audioStart() {
  if (!Instelling.geluid) return;
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      HOOFD = AC.createGain(); HOOFD.gain.value = MEESTER; HOOFD.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}

function toon(freq, duur, type = 'sine', vol = 0.15, na = 0, eind = null) {
  const t = AC.currentTime + na, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (eind) o.frequency.exponentialRampToValueAtTime(eind, t + duur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + duur);
  o.connect(g).connect(HOOFD);
  o.start(t); o.stop(t + duur + 0.03);
}

let _ruisBuf = null;
function ruisBuffer() {
  if (_ruisBuf) return _ruisBuf;
  const n = AC.sampleRate * 2, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return (_ruisBuf = b);
}
function ruis(duur, vol, freq, na = 0, q = 0.8, soort = 'bandpass', eindFreq = null) {
  const bron = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime + na;
  bron.buffer = ruisBuffer(); f.type = soort; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (eindFreq) f.frequency.exponentialRampToValueAtTime(eindFreq, t + duur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + duur);
  bron.connect(f).connect(g).connect(HOOFD);
  bron.start(t, Math.random()); bron.stop(t + duur + 0.05);
}


function geluid(soort, g) {
  if (!Instelling.geluid || !AC) return;
  try {
    switch (soort) {
      case 'sprong': toon(260, 0.13, 'sine', 0.12, 0, 560); ruis(0.08, 0.05, 1800, 0, 1.2); break;
      case 'land': toon(210, 0.09, 'sine', 0.14, 0, 120); ruis(0.07, 0.06, 700, 0, 1.5); break;
      case 'plons': ruis(0.45, 0.22, 1100, 0, 0.7, 'bandpass', 380); toon(150, 0.3, 'sine', 0.12, 0, 60); break;
      case 'tong': toon(900, 0.08, 'sine', 0.1, 0, 300); break;
      case 'vang': {

        const c = Math.min(8, (g && g.combo) || 1), f = 520 * Math.pow(1.122, c - 1);
        toon(f, 0.08, 'triangle', 0.13, 0, f * 1.5); toon(320, 0.12, 'sine', 0.1, 0.06, 110);
        break;
      }
      case 'mis': toon(420, 0.1, 'sine', 0.06, 0, 300); break;
      case 'au': toon(240, 0.22, 'square', 0.09, 0, 120); ruis(0.15, 0.14, 900, 0, 1); break;
      case 'zinkt': for (let i = 0; i < 4; i++) toon(380 + i * 90, 0.06, 'sine', 0.06, i * 0.08, 760 + i * 120); break;
      case 'hartje': [659, 784, 988, 1319].forEach((f, i) => toon(f, 0.18, 'triangle', 0.09, i * 0.08)); break;
      case 'meegesleurd': ruis(0.5, 0.12, 500, 0, 0.6, 'bandpass', 2400); break;
      case 'te_ver': toon(210, 0.12, 'square', 0.04, 0, 150); break;
      case 'rimpel': toon(1300, 0.05, 'sine', 0.035, 0, 700); break;
      case 'klaar': [392, 349, 311, 262].forEach((f, i) => toon(f, 0.32, 'triangle', 0.08, i * 0.16)); break;
      case 'record': [523, 659, 784, 1047, 1319].forEach((f, i) => toon(f, 0.3, 'triangle', 0.1, i * 0.1)); break;
      case 'klik': toon(760, 0.03, 'square', 0.03); break;
      case 'start': [392, 523, 659].forEach((f, i) => toon(f, 0.16, 'triangle', 0.08, i * 0.07)); break;
    }
  } catch (e) { console.warn('geluid', soort, e); }
}



const Stemmen = new Map();

function maakStem(soort) {
  const o = AC.createOscillator(), o2 = AC.createOscillator(), lfo = AC.createOscillator(), diep = AC.createGain();
  const fl = AC.createBiquadFilter(), g = AC.createGain(), pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
  const wesp = soort === 'wesp';

  o.type = 'sawtooth'; o.frequency.value = wesp ? 250 : 120;
  o2.type = wesp ? 'sawtooth' : 'square'; o2.frequency.value = wesp ? 263 : 123;
  lfo.frequency.value = wesp ? 11 : 32; diep.gain.value = wesp ? 22 : 30;
  lfo.connect(diep); diep.connect(o.frequency); diep.connect(o2.frequency);
  fl.type = 'bandpass'; fl.frequency.value = wesp ? 700 : 520; fl.Q.value = wesp ? 1.4 : 1.1;
  g.gain.value = 0.0001;
  o.connect(fl); o2.connect(fl); fl.connect(g);
  if (pan) { g.connect(pan); pan.connect(HOOFD); } else g.connect(HOOFD);
  o.start(); o2.start(); lfo.start();
  return {
    zet(sterkte, links) {
      g.gain.setTargetAtTime(Math.max(0.0001, sterkte), AC.currentTime, 0.05);
      if (pan) pan.pan.setTargetAtTime(klem(links, -1, 1), AC.currentTime, 0.05);
    },
    stop() {
      g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.08);
      setTimeout(() => { try { o.stop(); o2.stop(); lfo.stop(); } catch (e) {  } }, 500);
    },
  };
}

function werkStemmenBij(s) {
  if (!AC || !Instelling.geluid) { stilStemmen(); return; }
  const kk = s.kikker, levend = new Set();
  const dieren = s.klaar ? [] : s.wespen.map((w) => ['wesp', w]).concat(s.libellen.map((l) => ['libel', l]));
  for (const [soort, d] of dieren) {
    levend.add(d.id);
    let st = Stemmen.get(d.id);
    if (!st) { try { st = maakStem(soort); } catch (e) { console.warn('stem', soort, e); continue; } Stemmen.set(d.id, st); }

    const x = d.aankondiging > 0 ? (d.x < 0 ? -10 : W + 10) : d.x;
    const dist = afstand(x, d.y, kk.x, kk.y);
    const sterkte = (soort === 'wesp' ? 0.07 : 0.06) * klem(1.25 - dist / 160, 0.15, 1) * (d.fase === 'weg' ? 0.5 : 1);
    st.zet(sterkte, (x - W / 2) / (W / 2));
  }
  for (const [id, st] of Stemmen) if (!levend.has(id)) { st.stop(); Stemmen.delete(id); }
}

function stilStemmen() {
  for (const st of Stemmen.values()) st.stop();
  Stemmen.clear();
}


let Beek = null;
function beekAan() {
  if (!AC || !Instelling.geluid || Beek) return;
  try {
    const bron = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), lfo = AC.createOscillator(), diep = AC.createGain();
    bron.buffer = ruisBuffer(); bron.loop = true;
    f.type = 'lowpass'; f.frequency.value = 520; f.Q.value = 0.6;
    lfo.frequency.value = 0.23; diep.gain.value = 180; lfo.connect(diep).connect(f.frequency);
    g.gain.value = 0.0001; g.gain.setTargetAtTime(0.05, AC.currentTime, 0.6);
    bron.connect(f).connect(g).connect(HOOFD);
    bron.start(); lfo.start();
    Beek = { stop() { g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.3); setTimeout(() => { try { bron.stop(); lfo.stop(); } catch (e) {  } }, 1200); } };
  } catch (e) { Beek = null; }
}
function beekUit() { if (Beek) { Beek.stop(); Beek = null; } }

function tril(ms) {
  if (!Instelling.trillen) return;
  try {
    if (window.RivierApp && RivierApp.tril) RivierApp.tril(ms);
    else if (navigator.vibrate) navigator.vibrate(ms);
  } catch (e) {  }
}





const $ = (id) => document.getElementById(id);
const beeldUrl = (n) => (typeof SPRITE_BRON !== 'undefined' && SPRITE_BRON[n]) || '';

const OORZAAK_TEKST = { wesp: 'wesp', libel: 'libel', stroom: 'meegesleurd', mis: 'mis gesprongen', gezonken: 'gezonken blaadje' };

function toonScherm(naam) {
  for (const id of ['startScherm', 'pauzeScherm', 'eindScherm']) $(id).hidden = id !== naam;
  $('hud').hidden = naam === 'startScherm';
}

function zetSchakels() {
  document.querySelectorAll('.schakel').forEach((k) => {
    const aan = Instelling[k.dataset.inst];
    k.setAttribute('aria-pressed', aan ? 'true' : 'false');
    k.textContent = (k.dataset.inst === 'geluid' ? 'Geluid ' : 'Trillen ') + (aan ? 'aan' : 'uit');
  });
}

const Hud = { hartjes: -1, meters: -1, vliegen: -1 };
function hudBij(s) {
  if (s.hartjes !== Hud.hartjes) {
    const meer = s.hartjes > Hud.hartjes && Hud.hartjes >= 0;
    Hud.hartjes = s.hartjes;
    const el = $('hartjes');
    el.innerHTML = '';
    for (let i = 0; i < HARTJES; i++) {
      const im = document.createElement('img');
      im.className = 'px' + (i < s.hartjes ? '' : ' leeg') + (meer && i === s.hartjes - 1 ? ' erbij' : '');
      im.src = beeldUrl('hartje'); im.alt = '';
      el.appendChild(im);
    }
  }
  if (s.meters !== Hud.meters) { Hud.meters = s.meters; $('meters').textContent = s.meters; }
  if (s.vliegenGevangen !== Hud.vliegen) { Hud.vliegen = s.vliegenGevangen; $('vliegen').textContent = s.vliegenGevangen; }
}
function hudOpnieuw() { Hud.hartjes = Hud.meters = Hud.vliegen = -1; }


function hintBlad(s) {
  const kk = s.kikker;
  let beste = null;
  for (const b of s.bladen) {
    if (b.id === kk.blad || BLADEN[b.soort].zinkt || b.y <= kk.y + 10) continue;
    if (afstand(kk.x, kk.y, b.x, b.y) > SPRONG_MAX * 0.95) continue;
    if (!beste || b.y - Math.abs(b.x - kk.x) * 0.3 > beste.y - Math.abs(beste.x - kk.x) * 0.3) beste = b;
  }
  return beste;
}
function tekenHint(s, nu) {
  const b = hintBlad(s);
  if (!b) return;
  const c = Beeld.ctx, sy = naarScherm(s, b.y), r = bladStraal(b) + 3 + Math.sin(nu / 180) * 2;
  c.save();
  c.globalAlpha = 0.55 + 0.35 * Math.sin(nu / 180);
  c.strokeStyle = '#fff6c8'; c.lineWidth = 2;
  c.beginPath();
  if (b.soort === 'stam') c.rect(b.x - BLADEN.stam.hw - 3, sy - BLADEN.stam.hh - 3, BLADEN.stam.hw * 2 + 6, BLADEN.stam.hh * 2 + 6);
  else c.arc(b.x, sy, r, 0, Math.PI * 2);
  c.stroke();
  c.restore();
}

function eindTekst(s, bewaard, record) {
  $('eindTitel').textContent = record ? 'Nieuw record!' : 'Einde van de tocht';
  $('eindMeters').textContent = s.meters;
  $('eindVliegen').textContent = s.vliegenGevangen === 1 ? '1 vlieg gevangen' : s.vliegenGevangen + ' vliegen gevangen';
  const delen = Object.entries(s.oorzaak).sort((a, b) => b[1] - a[1]).map(([k, n]) => (OORZAAK_TEKST[k] || k) + '\u00a0' + n + '×');
  $('eindOorzaak').textContent = delen.length ? 'Hartjes kwijt aan: ' + delen.join(' · ') : '';
  $('eindBeste').textContent = record ? 'Vorige beste: ' + bewaard.vorigeBeste + ' m' : 'Beste: ' + bewaard.beste + ' m';
}

function startTekst(bewaard) {
  $('startBeste').textContent = bewaard.beste > 0 ? 'Beste: ' + bewaard.beste + ' m · ' + bewaard.besteVliegen + ' vliegen in één tocht' : '';
}

function vulBeelden() {
  document.querySelectorAll('[data-beeld]').forEach((im) => { im.src = beeldUrl(im.dataset.beeld); });
}






const OPSLAG_SLEUTEL = 'lefrawg_rivier_v1';
const DT = 1 / 60;
const Stand = { fase: 'start', eindOp: 0, acc: 0, vorige: 0, demo: '' };
let S = null;
let Bewaard = { v: 1, beste: 0, besteVliegen: 0, gespeeld: 0, meters: 0, vliegen: 0, geluid: true, trillen: true };

function laadBewaard() {
  let tekst = '';
  try { if (window.RivierApp) tekst = RivierApp.laad(); } catch (e) { tekst = ''; }
  if (!tekst) { try { tekst = localStorage.getItem(OPSLAG_SLEUTEL) || ''; } catch (e) { tekst = ''; } }
  try { const b = tekst ? JSON.parse(tekst) : null; if (b && b.v === 1) Object.assign(Bewaard, b); } catch (e) {  }
  Instelling.geluid = Bewaard.geluid !== false;
  Instelling.trillen = Bewaard.trillen !== false;
}

function bewaar() {
  if (Stand.demo) return;
  Bewaard.geluid = Instelling.geluid; Bewaard.trillen = Instelling.trillen;
  const tekst = JSON.stringify(Bewaard);
  try { if (window.RivierApp) RivierApp.bewaar(tekst); } catch (e) {  }
  try { localStorage.setItem(OPSLAG_SLEUTEL, tekst); } catch (e) {  }
}

function maatCanvas() {
  const cv = Beeld.cv, iw = window.innerWidth || 360, ih = window.innerHeight || 780;

  const H = Math.round(klem((W * ih) / iw, 300, 440));
  if (cv.height !== H || cv.width !== W) { cv.width = W; cv.height = H; }
  Beeld.H = H;
  if (S) S.H = H;
  const schaal = Math.min(iw / W, ih / H);
  cv.style.width = Math.floor(W * schaal) + 'px';
  cv.style.height = Math.floor(H * schaal) + 'px';
  Beeld.ctx.imageSmoothingEnabled = false;
}

function nieuweTocht(zaad) {
  S = nieuwSpel(zaad != null ? zaad : (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, Beeld.H);
  Beeld.deeltjes = [];
  hudOpnieuw();
  Stand.acc = 0; Stand.eindOp = 0;
}

function speel() {
  audioStart();
  geluid('start');
  if (!S || S.klaar || S.begonnen) nieuweTocht();
  Stand.fase = 'spel';
  toonScherm(null);
  $('hint').hidden = S.begonnen;
  if (S.begonnen) beekAan();
}

function pauzeer() {
  if (Stand.fase !== 'spel') return;
  Stand.fase = 'pauze';
  stilStemmen(); beekUit();
  toonScherm('pauzeScherm');
}

function naarStart() {
  Stand.fase = 'start';
  stilStemmen(); beekUit();
  nieuweTocht();
  startTekst(Bewaard);
  toonScherm('startScherm');
}

function einde() {
  Stand.fase = 'eind';
  stilStemmen(); beekUit();
  const record = S.meters > Bewaard.beste;
  Bewaard.vorigeBeste = Bewaard.beste;
  Bewaard.gespeeld++;
  Bewaard.meters += S.meters; Bewaard.vliegen += S.vliegenGevangen;
  if (record) Bewaard.beste = S.meters;
  Bewaard.besteVliegen = Math.max(Bewaard.besteVliegen, S.vliegenGevangen);
  bewaar();
  eindTekst(S, Bewaard, record && Bewaard.vorigeBeste > 0);
  if (record && Bewaard.vorigeBeste > 0) geluid('record');
  toonScherm('eindScherm');
}

function verwerkGebeurd(s, nu) {
  if (!s.gebeurd.length) return;
  maakDeeltjes(s, nu);
  for (const g of s.gebeurd) {
    geluid(g.soort, g);
    if (g.soort === 'au') tril(60);
    else if (g.soort === 'plons') tril(25);
    else if (g.soort === 'sprong' && !$('hint').hidden) { $('hint').hidden = true; beekAan(); }
    else if (g.soort === 'hartje') tril(20);
  }
  s.gebeurd.length = 0;
}

function lus(t) {
  requestAnimationFrame(lus);
  if (document.hidden) { Stand.vorige = 0; return; }
  const dt = Stand.vorige ? Math.min(0.1, (t - Stand.vorige) / 1000) : 0;
  Stand.vorige = t;
  if (Stand.fase === 'spel' && !Stand.bevroren) {
    Stand.acc += dt;
    while (Stand.acc >= DT) {
      if (Stand.demo) demoZet(S);
      stap(S, DT);
      Stand.acc -= DT;
    }
    werkStemmenBij(S);
    if (S.klaar && !Stand.eindOp) Stand.eindOp = t + 1100;
    if (Stand.eindOp && t > Stand.eindOp) { Stand.eindOp = 0; einde(); }
  }
  verwerkGebeurd(S, t);
  tekenAlles(S, t);
  if (!S.begonnen && Stand.fase === 'spel') tekenHint(S, t);
  hudBij(S);
}

function aanraking(e) {
  audioStart();
  if (Stand.fase !== 'spel' || S.klaar || Stand.demo) return;
  e.preventDefault();
  const r = Beeld.cv.getBoundingClientRect();
  const lx = ((e.clientX - r.left) * W) / r.width, ly = ((e.clientY - r.top) * Beeld.H) / r.height;
  tik(S, lx, naarWereld(S, ly));
}

window.terugKnop = () => {
  if (Stand.fase === 'spel') { pauzeer(); return true; }
  if (Stand.fase === 'pauze' || Stand.fase === 'eind') { naarStart(); return true; }
  return false;
};
window.appPauze = () => { pauzeer(); bewaar(); };
window.appHervat = () => { Stand.vorige = 0; };



function demoZet(s) {
  if (s.klaar) return;
  const kk = s.kikker;
  if (Stand.bevriesOp && s.t >= Stand.bevriesOp) { Stand.bevroren = true; return; }
  s.demoWacht = (s.demoWacht || 0) - DT;
  if (s.demoWacht > 0 || kk.staat !== 'zit' || kk.tong) return;
  s.demoWacht = 0.35 + s.rng() * 0.3;
  const vlieg = s.vliegen.find((v) => afstand(kk.x, kk.y, v.x, v.y) < TONG_MAX - 4);
  if (vlieg) { tik(s, vlieg.x, vlieg.y); return; }
  let beste = null;
  for (const b of s.bladen) {
    if (b.id === kk.blad || afstand(kk.x, kk.y, b.x, b.y) > SPRONG_MAX * 0.9) continue;
    const waarde = b.y - kk.y - (BLADEN[b.soort].zinkt ? 12 : 0);
    if (!beste || waarde > beste.w) beste = { b, w: waarde };
  }
  if (beste && (beste.w > 4 || kk.y - s.camY < s.H * 0.3)) tik(s, beste.b.x, beste.b.y);
}

async function start() {
  Beeld.cv = $('rivier');
  Beeld.ctx = Beeld.cv.getContext('2d');
  await laadBeelden();
  laadBewaard();
  vulBeelden();
  $('startKikker').src = beeldUrl('kikker_groot');
  $('vliegIcoon').src = beeldUrl('vlieg');
  maatCanvas();
  nieuweTocht();
  startTekst(Bewaard);
  zetSchakels();
  toonScherm('startScherm');

  window.addEventListener('resize', maatCanvas);
  Beeld.cv.addEventListener('pointerdown', aanraking);
  $('startKnop').addEventListener('click', speel);
  $('verderKnop').addEventListener('click', () => { geluid('klik'); Stand.fase = 'spel'; Stand.vorige = 0; toonScherm(null); if (S.begonnen) beekAan(); });
  $('stopKnop').addEventListener('click', () => { geluid('klik'); naarStart(); });
  $('opnieuwKnop').addEventListener('click', () => { nieuweTocht(); speel(); });
  $('menuKnop').addEventListener('click', () => { geluid('klik'); naarStart(); });
  $('pauzeKnop').addEventListener('click', () => { geluid('klik'); pauzeer(); });
  document.querySelectorAll('.schakel').forEach((k) => k.addEventListener('click', () => {
    Instelling[k.dataset.inst] = !Instelling[k.dataset.inst];
    if (k.dataset.inst === 'geluid') { if (Instelling.geluid) audioStart(); else { stilStemmen(); beekUit(); } }
    if (k.dataset.inst === 'trillen' && Instelling.trillen) tril(30);
    zetSchakels(); bewaar(); geluid('klik');
  }));
  document.addEventListener('visibilitychange', () => { if (document.hidden) window.appPauze(); else window.appHervat(); });
  window.addEventListener('pagehide', () => window.appPauze());

  const lokaal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const m = lokaal && /demo=(\d+)(?:,(\d+))?/.exec(location.hash);
  if (m) {
    Stand.demo = location.hash;
    nieuweTocht(Number(m[2] || 4242));
    Stand.bevriesOp = Number(m[1]);
    Stand.fase = 'spel'; toonScherm(null); $('hint').hidden = true;

    const b = hintBlad(S); if (b) tik(S, b.x, b.y);
  } else if (lokaal && location.hash === '#spel') speel();
  requestAnimationFrame(lus);
}

start();
