<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Le Cævia</title>
<style>

:root {
  --grond: #1a1410; --vlak: #2a2018; --vlak2: #352a1f; --lijn: #4a3a28;
  --inkt: #f7efe3; --inkt2: #cdbb9e; --goud: #9bd36a; --goud-inkt: #14240a;
  --goed: #9bd36a; --let: #ffb547; --slecht: #ff6b5e; --band: #f2c14e; --hart: #f29ac0;
  --kop: "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", sans-serif;
  --tekst: Roboto, "sans-serif", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--grond); color: var(--inkt); font: 15px/1.4 var(--tekst); overscroll-behavior: none; }
body { user-select: none; -webkit-user-select: none; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--goud); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--kop); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }

#app { height: 100%; display: flex; flex-direction: column; }
.kop { display: flex; align-items: center; gap: 10px; padding: 10px 16px 6px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.paardknop { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-align: left; }
.paardknop img { width: 40px; height: 40px; object-fit: contain; }
.paardknop b { display: block; font-family: var(--kop); font-size: 20px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paardknop small { display: block; color: var(--inkt2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.munten { display: flex; align-items: center; gap: 6px; background: var(--vlak2); border: 1px solid var(--lijn); border-radius: 999px; padding: 4px 12px 4px 6px; font-family: var(--kop); font-size: 18px; font-weight: 700; color: var(--goud); font-variant-numeric: tabular-nums; }
.munten img { width: 24px; height: 24px; }
.rond { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--vlak2); border: 1px solid var(--lijn); }
.rond svg { width: 22px; height: 22px; fill: var(--inkt2); }

main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.tab { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 10px; }

.scene-kader { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid #070a12; box-shadow: 0 6px 18px rgba(0,0,0,.45); background: #070a12; }
#hok { display: block; width: 100%; height: auto; touch-action: manipulation; }
.klokje { position: absolute; right: 8px; top: 8px; font: 700 12px var(--kop); color: #fff; background: rgba(7,10,18,.6); padding: 2px 8px; border-radius: 999px; letter-spacing: 0.04em; pointer-events: none; }
.hoek-knop { position: absolute; right: 8px; bottom: 8px; font: 700 12px var(--kop); color: #fff; background: rgba(7,10,18,.6); padding: 4px 10px; border-radius: 999px; letter-spacing: 0.03em; }
.bak-naam { position: absolute; left: 8px; top: 8px; font: 700 12px var(--kop); color: #fff; background: rgba(7,10,18,.6); padding: 2px 8px; border-radius: 999px; pointer-events: none; max-width: calc(100% - 136px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.bewoners { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.bewoners::-webkit-scrollbar { display: none; }
.bewoners:empty { display: none; }
.bewoner { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--vlak); border: 1px solid var(--lijn); white-space: nowrap; font-size: 13px; flex: none; }
.bewoner img { width: 28px; height: 28px; object-fit: contain; }
.bewoner[aria-pressed="true"] { border-color: var(--goud); background: var(--vlak2); }
.bewoner .waar { color: var(--inkt2); font-size: 11px; }
.bewoner .waar.ziek { color: var(--slecht); }

.melding { margin: 0; min-height: 22px; font-size: 14px; }
.melding .ziek { color: var(--slecht); font-weight: 700; }
.makheid { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; column-gap: 8px; }
.makheid img { width: 22px; height: 22px; }
.makheid .balk { height: 10px; }
.makheid .balk i { background: var(--band); }
.makheid b { font: 700 13px var(--kop); color: var(--band); }
.makheid small { grid-column: 2 / 4; font-size: 11px; color: var(--inkt2); }

.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; }
.meter { display: grid; grid-template-columns: 22px 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center; }
.meter img { grid-row: span 2; width: 22px; height: 22px; object-fit: contain; }
.meter span { font-size: 11px; color: var(--inkt2); display: flex; justify-content: space-between; letter-spacing: 0.02em; }
.meter span b { color: var(--inkt); font-weight: 600; font-variant-numeric: tabular-nums; }
.balk { height: 8px; border-radius: 4px; background: #070a12; overflow: hidden; border: 1px solid #05070d; }
.balk i { display: block; height: 100%; border-radius: 3px; background: var(--goed); transition: width .4s ease; }
.balk i.let { background: var(--let); } .balk i.slecht { background: var(--slecht); }
.stalmeters { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--inkt2); }
.stalmeters span { display: flex; align-items: center; gap: 4px; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 999px; padding: 2px 10px 2px 4px; }
.stalmeters img { width: 20px; height: 20px; object-fit: contain; }
.stalmeters b { color: var(--inkt); font-weight: 600; }
.stalmeters span.slecht { border-color: var(--slecht); color: var(--slecht); }

.acties { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.actie { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); font-size: 12px; font-weight: 600; min-height: 64px; position: relative; text-align: center; }
.actie img { width: 32px; height: 32px; object-fit: contain; }
.actie .aantal { position: absolute; top: 4px; right: 8px; font-size: 11px; color: var(--inkt2); }
.actie[aria-disabled="true"] { opacity: .45; }

.aanmeld { border-color: var(--goud); background: linear-gradient(135deg, #2a2a20, var(--vlak)); }
.aanmeld .knop2 { color: var(--goud); }
.aanmeldkaart { border-top: 1px solid var(--lijn); padding-top: 6px; margin-top: 6px; }
.knop2.hoofd { background: var(--goud); color: var(--goud-inkt); border-color: var(--goud); }


.hud { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.hud .doel span { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--inkt2); font-variant-numeric: tabular-nums; }
.hud .doel b { color: var(--inkt); font-family: var(--kop); font-size: 16px; }
#treinDoek { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; touch-action: none; border-radius: 12px; background: #070a12; }

#tab-spelen:has(#treinStuur) { min-height: 100%; }
.stuur { display: grid; grid-template-columns: repeat(3, minmax(0, 116px)); grid-template-rows: repeat(2, minmax(62px, 1fr)); gap: 8px; justify-content: center; touch-action: none; flex: 1 1 auto; max-height: 208px; }
.stuur button:nth-child(1) { grid-column: 2; grid-row: 1; }
.stuur button:nth-child(2) { grid-column: 1; grid-row: 2; }
.stuur button:nth-child(3) { grid-column: 2; grid-row: 2; }
.stuur button:nth-child(4) { grid-column: 3; grid-row: 2; }
.pijlknop { display: grid; place-items: center; border-radius: 14px; background: var(--vlak2); border: 1px solid var(--lijn); box-shadow: 0 3px 0 #120d09; touch-action: none; }
.pijlknop svg { width: 34px; height: 34px; fill: var(--inkt); pointer-events: none; }
.pijlknop.in { background: var(--goud); box-shadow: none; transform: translateY(2px); }
.pijlknop.in svg { fill: var(--goud-inkt); }
.spelkaart .loon { display: flex; align-items: center; color: var(--goud); }
.spelkaart .loon img { width: 22px; height: 22px; }


.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { white-space: nowrap; padding: 6px 14px; border-radius: 999px; background: var(--vlak); border: 1px solid var(--lijn); font-size: 13px; font-weight: 600; color: var(--inkt2); }
.chip[aria-pressed="true"] { background: var(--goud); color: var(--goud-inkt); border-color: var(--goud); }
.lijst { display: grid; gap: 8px; }
.kaart { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); text-align: left; width: 100%; }
.kaart img { width: 56px; height: 56px; object-fit: contain; border-radius: 10px; background: var(--vlak2); }
.kaart h3 { font-size: 16px; }
.kaart p { margin: 2px 0 0; font-size: 12.5px; color: var(--inkt2); }
.kaart .bezit { font-size: 11.5px; color: var(--goed); margin-top: 2px; }
.prijs { display: flex; align-items: center; gap: 4px; background: var(--goud); color: var(--goud-inkt); font: 700 15px var(--kop); padding: 8px 12px; border-radius: 12px; white-space: nowrap; }
.prijs img { width: 18px; height: 18px; }
.prijs[aria-disabled="true"] { background: var(--vlak2); color: var(--inkt2); }
.knop2 { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--lijn); background: var(--vlak2); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.knop2[aria-disabled="true"] { opacity: .45; }
.hoofdknop { width: 100%; padding: 14px 16px; border-radius: 14px; background: var(--goud); color: var(--goud-inkt); font: 700 18px var(--kop); margin-top: 8px; box-shadow: 0 3px 0 #5f8c3a; }
.rij { display: flex; gap: 8px; flex-wrap: wrap; }
.label { margin: 10px 0 4px; font: 700 12px var(--kop); letter-spacing: 0.08em; text-transform: uppercase; color: var(--inkt2); }
.uitleg { margin: 4px 0; font-size: 13px; color: var(--inkt2); }
.weetje { background: var(--vlak); border: 1px solid var(--lijn); border-left: 3px solid var(--goud); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; margin-top: 8px; }
.feiten { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0; font-size: 14px; }
.feiten dt { color: var(--inkt2); } .feiten dd { margin: 0; }
.invoer { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--lijn); background: var(--vlak2); color: var(--inkt); font: 600 16px var(--tekst); user-select: text; -webkit-user-select: text; }
.groot-beeld { display: grid; place-items: center; background: var(--vlak); border-radius: 14px; padding: 12px; }
.groot-beeld img { width: 100%; max-width: 288px; height: 150px; object-fit: contain; }
.groot-beeld.duo { grid-template-columns: 1fr 1fr; gap: 8px; }
.groot-beeld.duo img { height: 110px; }
.rij.twee { display: grid; grid-template-columns: 1fr 1fr; }
.kaart h3 .waar { font: 600 11px var(--tekst); color: var(--let); }

.boek-kop { display: flex; justify-content: space-between; align-items: baseline; }
.boek-kop span { color: var(--inkt2); font-size: 13px; }
.raster { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dierkaart { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px 8px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); overflow: hidden; }
.dierkaart img { width: 64px; height: 64px; object-fit: contain; }
.dierkaart b { font: 700 13px var(--kop); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dierkaart small { font-size: 11px; color: var(--inkt2); display: flex; align-items: center; gap: 3px; }
.dierkaart.nieuw img { filter: brightness(0.25) saturate(0.4); }
.dierkaart .lint { position: absolute; left: 0; top: 0; width: 100%; height: 4px; }
.modi { display: grid; gap: 8px; }
.modus { text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); }
.modus[aria-pressed="true"] { border-color: var(--goud); background: var(--vlak2); }
.modus b { font-family: var(--kop); font-size: 16px; }
.modus p { margin: 2px 0 0; font-size: 12.5px; color: var(--inkt2); }

nav.onder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); background: #150f0c; border-top: 1px solid #0e0a08; }
nav.onder button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; font-size: 11px; font-weight: 600; color: var(--inkt2); }
nav.onder button img { width: 28px; height: 28px; object-fit: contain; }
nav.onder button[aria-selected="true"] { color: var(--goud); }

.vel { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.vel-doek { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.vel-paneel { position: relative; max-height: 88%; overflow-y: auto; background: var(--grond); border-radius: 22px 22px 0 0; border-top: 1px solid var(--lijn); padding: 8px 16px 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.vel-greep { width: 40px; height: 4px; border-radius: 2px; background: var(--lijn); margin: 4px auto 10px; }
.vel-kop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.vel-kop h2 { font-size: 24px; }

.toast { position: fixed; left: 16px; right: 16px; margin: 0 auto; width: fit-content; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; align-items: center; gap: 10px; max-width: 480px; background: #f3efe2; color: #18140c; padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.toast img { width: 32px; height: 32px; object-fit: contain; }
#vel:not([hidden]) + .toast { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


#studio { --gw: min(96vw, 66vh); position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: rgb(8,11,53) linear-gradient(to bottom, rgb(4,5,31) 0%, rgb(6,7,44) calc(50% + var(--gw) * -0.5195), rgb(7,8,46) calc(50% + var(--gw) * -0.4330), rgb(7,9,49) calc(50% + var(--gw) * -0.3463), rgb(8,10,50) calc(50% + var(--gw) * -0.2598), rgb(8,11,52) calc(50% + var(--gw) * -0.1732), rgb(8,11,53) calc(50% + var(--gw) * -0.0866), rgb(8,11,53) calc(50% + var(--gw) * 0.0000), rgb(8,11,52) calc(50% + var(--gw) * 0.0866), rgb(8,10,50) calc(50% + var(--gw) * 0.1732), rgb(7,9,49) calc(50% + var(--gw) * 0.2598), rgb(7,8,47) calc(50% + var(--gw) * 0.3463), rgb(6,7,44) calc(50% + var(--gw) * 0.4330), rgb(5,6,42) calc(50% + var(--gw) * 0.5195), rgb(4,5,31) 100%); transition: opacity .45s ease; }
#studio.weg { opacity: 0; pointer-events: none; }
#studio img { display: block; width: var(--gw); height: auto; animation: studioIn .5s ease both; }
@keyframes studioIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }

</style>
</head>

function statusTekst(S, p) {

  if (p.ziek) return '<span class="ziek">' + n + ' is ziek: ' + esc(klein(ZIEKTES[p.ziek].naam)) + '.</span> ' + esc(ZIEKTES[p.ziek].tekst);
  if (temp >= TEMP.gevaar) return '<span class="ziek">Het is veel te warm in het hok (' + graden(temp) + ').</span> Boven 26 graden wordt het gevaarlijk: leg een koelfles neer' + (v.binnen ? '' : ' of verhuis naar binnen') + '.';
  if (!v.binnen && temp < TEMP.koud) return 'Het is koud buiten (' + graden(temp) + '). Onder 15 graden horen cavia\'s binnen; in de winter buiten kan alleen met een groepje van minstens vier.';
  if (S.hok.hooi <= 0) return '<span class="ziek">De hooiruif is leeg!</span> Hooi hoort er altijd te zijn.';
  if (S.hok.water <= 0) return '<span class="ziek">De drinkfles is leeg!</span> Geef vers water.';
  if (p.vitc < 25) return n + ' heeft vitamine C nodig: geef groente, zoals paprika.';
  if (temp >= TEMP.stress) return 'Het wordt warm in het hok (' + graden(temp) + '): leg een koelfles neer, daar gaan ze tegenaan liggen.';
  if (S.hok.schoon < 30) return 'Het stro is vies: haal de vieze plekjes weg, of verschoon de hele bodem.';
  if (isLang(p) && p.haar < 40) return 'Het lange haar van ' + n + ' raakt in de war: elke dag borstelen.';
  if (!isLang(p) && p.haar < 20) return 'Tijd om ' + n + ' te borstelen: kortharig een keer per week.';
  if (schuilplekken(S) < ids.length + 1) return 'Er zijn te weinig schuilplekken: een per cavia, plus één extra.';
  if (p.eten < 30) return n + ' heeft honger.';
  if (isNacht(t)) return 'Het is nacht: de cavia\'s rusten en doen korte dutjes.';
  if (isJong(p)) return n + ' is nog jong en groeit (' + Math.round(p.groot * 100) + '%).';
  const st = stemming(p);
  if (st > 85) return n + ' is helemaal tevreden.';

}

function doeActie(actie) {
  const id = S.gekozen, p = S.dieren[id], t = Date.now();
  if (!p) return;
  let r;
  if (actie === 'hooi') {
    r = hooiBijvullen(S);
    if (r.ok) { geluid('hooi'); melding(r.vol ? 'De hooiruif is weer vol. Hooi hoort er altijd te zijn.' : 'Bijgevuld, maar het hooi is nu op: koop een nieuwe baal.', 'voer/hooi'); nieuwWeetje(S, t, 'hooi'); }
  } else if (actie === 'groente') return groenteVel();
  else if (actie === 'brokjes') {
    r = geefBrokjes(S, t);
    if (r.ok) { geluid('knabbel'); legGroente(S, 'korrels', Math.min(3, r.aantal)); melding(r.extra ? 'Vandaag al brokjes gehad: meer dan één portie per dag maakt dik.' : 'Een portie brokjes voor ' + (r.aantal === alle(S).length ? 'iedereen' : r.aantal + ' cavia\'s') + '. Eén per dag is genoeg.', 'voer/korrels'); nieuwWeetje(S, t, 'brokjes'); }
  } else if (actie === 'water') { r = waterVerversen(S); if (r.ok) { geluid('water'); melding('Vers water in de fles.', 'iconen/druppel'); nieuwWeetje(S, t, 'water'); } }
  else if (actie === 'schoon') return schoonVel();
  else if (actie === 'borstel') {
    r = borstel(S, id);
    if (r.ok) { geluid('borstel'); melding(p.naam + (r.lang ? ' is helemaal doorgekamd. Lang haar elke dag!' : ' is geborsteld. Kortharig is een keer per week genoeg.'), 'iconen/borstel'); nieuwWeetje(S, t, 'borstelen'); }
  } else if (actie === 'zitten') {
    r = bijZeZitten(S, t); Hok.zitTot = performance.now() + 9000; hartjes(S); geluid('wheek');
    melding(r.al ? 'Je zit nog even bij ze op de grond.' : 'Je gaat bij ze op de grond zitten. Ze komen kijken! Een cavia is geen knuffeldier: zo vinden ze het fijn.', 'iconen/hart');
    nieuwWeetje(S, t, 'optillen'); veranderd(); return;
  } else if (actie === 'koel') { r = koelfles(S, t); if (r.ok) { geluid('water'); melding('Een fles met koud water in een doek: daar gaan ze tegenaan liggen.', 'iconen/thermometer'); nieuwWeetje(S, t, 'koelfles'); } }
  else if (actie === 'dokter') {
    const zieke = alle(S).find((x) => S.dieren[x].ziek), z = zieke ? S.dieren[zieke] : null;
    r = zieke ? dierenarts(S, zieke) : { ok: false, reden: 'Niemand is ziek.' };
    if (r.ok) { geluid('beter'); S.gekozen = zieke; melding(z.naam + ' is weer beter (' + r.prijs + ' munten). Deze dierenarts kent cavia\'s.', 'iconen/dokter'); nieuwWeetje(S, t, 'ziek'); }
  } else if (actie === 'weetje') { const w = nieuwWeetje(S, t); melding(w ? w.tekst : 'Je kent alle weetjes al!', 'iconen/boek'); veranderd(); return; }
  if (r && !r.ok && r.reden) { melding(r.reden); geluid('fout'); if (r.winkel) naarWinkel(r.winkel); }
  if (r && r.ok) tril(15);
  veranderd();
}

  let tekst = 'Je was ' + weg + ' weg.';
  if (r.verdiend > 0) tekst += ' Je cavia\'s verdienden ' + getal(r.verdiend) + ' munten.';
  if (S.hok.hooi <= 0) tekst += ' De hooiruif is leeg!';
  const gezien = new Set();
  for (const g of r.gebeurd) {
    nieuwsWeetje(g);
    if (gezien.has(g.soort)) continue;
    const z = gebeurtenisTekst(g);
    if (z) { tekst += ' ' + z; gezien.add(g.soort); }
  }
  melding(tekst, kopUrl(S.gekozen));
  setTimeout(() => geluid('wheek'), 300);
}
window.appPauze = () => { bewaarNu(); planMeldingen(); };
window.appHervat = () => { if (!S) return; const r = inhalen(S, Date.now()); if (r.minuten > 60) welkomTerug(r); if (S.welkom) toonDagBonus(); veranderd(); };
function toonDagBonus() {
  const b = dagBonus(S, Date.now());
  if (!b) return;
  const v = VOER_VAN[b.voer];
  const html = '<div class="groot-beeld"><img class="px" src="' + sprUrl('iconen/munt') + '" alt="" style="width:96px;height:96px"></div>' +
    '<p style="text-align:center;font:700 20px var(--kop);margin:6px 0">' + (b.reeks > 1 ? b.reeks + ' dagen op rij!' : 'Welkom terug!') + '</p>' +
    '<div class="lijst"><div class="kaart"><img class="px" src="' + sprUrl('iconen/munt') + '" alt=""><div><h3>' + b.munten + ' munten</h3><p>Morgen weer komen = meer munten (tot 7 dagen).</p></div><span></span></div>' +
    '<div class="kaart"><img class="px" src="' + sprUrl('voer/' + b.voer) + '" alt=""><div><h3>' + (b.voer === 'hooi' ? '1 portie hooi' : '2 stukjes ' + esc(v.naam.toLowerCase())) + '</h3><p>' + esc(v.tekst) + '</p></div><span></span></div></div>' +
    (b.weetje ? '<div class="weetje"><b>Weetje van de dag:</b> ' + esc(b.weetje.tekst) + '</div>' : '') + '<button class="hoofdknop" data-sluit>Dank je!</button>';
  setTimeout(() => { if ($('vel').hidden) { openVel('Dagbonus', html); geluid('munt'); } }, 700);
  veranderd();
}
window.terugKnop = () => {
  if (!$('vel').hidden) { sluitVel(); return true; }
  if (Trein.actief) { treinEinde(true); return true; }
  if (UI.tab !== 'hok') { UI.tab = 'hok'; renderTab(); renderAlles(); return true; }
  return false;
};

async function start() {
  await laadSprites();
  try { const i = JSON.parse(localStorage.getItem('lecaevia_inst') || 'null'); if (i) Object.assign(UI.instellingen, i); } catch (e) {  }
  ouderStart();
  const nu = Date.now();
  S = laadStaat();
  if (!S || !(S.v <= STAAT_VERSIE)) S = nieuweStaat(nu);
  else { herstelStaat(S, nu); S.v = STAAT_VERSIE; }
  const r = inhalen(S, nu);
  document.querySelectorAll('[data-icoon]').forEach((img) => { img.src = sprUrl(img.dataset.icoon); });
  $('muntIcoon').src = sprUrl('iconen/munt');
  document.addEventListener('click', (e) => { audioStart(); klik(e); });
  const lokaal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const demo = lokaal && location.hash.length > 1 ? location.hash.slice(1) : '';
  if (demo) zetDemo(demo);
  renderAlles(); renderTab();
  if (!demo && !S.welkom) welkomVel();
  else if (!demo) { if (r.minuten > 60) welkomTerug(r); toonDagBonus(); }
  if (demo) naDemo(demo);
  bewaarNu();

  let laatsteSim = 0, laatsteUi = 0, laatsteScene = 0;
  const lus = (t) => {
    requestAnimationFrame(lus);
    const klok = Date.now();
    if (klok - laatsteSim > 1000) {
      laatsteSim = klok;
      const rr = inhalen(S, klok);
      if (rr.minuten) {
        UI.vuil = true; bewaarStraks();
        for (const g of rr.gebeurd) {
          const z = gebeurtenisTekst(g);
          if (z) melding(z, g.soort === 'ziek' ? 'iconen/dokter' : g.soort === 'hittegolf' ? 'iconen/zon' : kopUrl(g.id || S.gekozen));
          nieuwsWeetje(g);
        }
      }
    }
    if (UI.vuil && t - laatsteUi > 250 && !UI.velOpen) { laatsteUi = t; renderAlles(); }
    if (document.hidden) return;
    if (t - laatsteScene > 33) {
      laatsteScene = t;
      if (UI.tab === 'hok') tekenHok(S, $('hok'), t);
    }
  };
  requestAnimationFrame(lus);
  document.addEventListener('visibilitychange', () => { if (document.hidden) window.appPauze(); else window.appHervat(); });
  window.addEventListener('pagehide', () => window.appPauze());
}




function zetDemo(soort) {
  const nu = Date.now();
  S = nieuweStaat(nu); S.welkom = true; S.modus = 'normaal'; S.bonus.dag = dagSleutel(nu);
  const m = /^(\w+?)(\d+)?$/.exec(soort) || [], wat = m[1] || soort, nr = Number(m[2] || 0);
  if (wat !== 'nacht') isNacht = () => false;
  const erbij = (vachten) => {
    S.munten = 1e6;
    for (const vacht of vachten) {
      if (alle(S).length >= verblijf(S).cap) break;
      const id = 'c' + (S.volgnr++);
      S.dieren[id] = nieuwDier(id, nu - 3 * DAG, { naam: NAMEN[alle(S).length + 2], vacht });
    }
  };
  if (['rijk', 'verblijf'].includes(wat)) {
    S.munten = 1e6;
    for (let n = 2; n <= VERBLIJVEN.length; n++) koopVerblijf(S, n);
    for (const s of SPULLEN) if (!START_SPULLEN.includes(s.id)) koopSpul(S, s.id);
    koopSpul(S, 'hooiruif'); koopSpul(S, 'drinkfles');
    kiesVerblijf(S, nr && wat === 'verblijf' ? nr : 4, nu);
    erbij(['sheltie', 'abessijn', 'himalaya', 'texel', 'teddy', 'gekruind', 'roodwit']);
    for (const s of SPULLEN) while (vrijeSpullen(S, s.id) > 0 && zetNeer(S, s.id).ok) {  }
    S.hok.hooi = hooiMax(S); S.hok.water = waterMax(S);
    S.munten = 25000;
  }
  if (wat === 'warm') { S.hitte = { dag: dagSleutel(nu), extra: 1 }; tempNu = () => 27.5; }
  if (wat === 'koud') { S.munten = 1e6; koopVerblijf(S, 3); kiesVerblijf(S, 3, nu); tempNu = () => 7; S.munten = 800; }
  if (wat === 'vies') S.hok.schoon = 18;
  if (wat === 'leeg') { S.hok.hooi = 0; S.hok.water = 0; }
  if (wat === 'ziek') { S.dieren.c1.ziek = 'scheurbuik'; S.dieren.c1.vitc = 4; }
  if (wat === 'jong') { S.munten = 1e6; koopVerblijf(S, 2); kiesVerblijf(S, 2, nu); erbij(['sheltie', 'himalaya']); S.dieren.c3.groot = 0.5; S.dieren.c4.groot = 0.6; S.munten = 800; }
  if (wat === 'asiel') { UI.tab = 'winkel'; UI.winkelCat = 'asiel'; S.munten = 2000; }
  if (wat === 'spel') UI.tab = 'spelen';
  bewaarNu = () => {};
}
function naDemo(soort) {
  if (soort.startsWith('spel')) setTimeout(() => startTrein($('tab-spelen'), treinKleuren(), { record: 0 }), 300);
}

start();

</script>
