<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Le Suikær</title>
<style>

:root {
  --grond: #0f1422; --vlak: #1a2235; --vlak2: #243050; --lijn: #34446a;
  --inkt: #eef2fa; --inkt2: #a9b6cf; --goud: #f2c46d; --goud-inkt: #24190a;
  --goed: #7ed9a6; --let: #ffb547; --slecht: #ff6b5e; --band: #f29ac0; --hart: #f29ac0;
  --kop: "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", sans-serif;
  --tekst: Roboto, "sans-serif", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--grond); color: var(--inkt); font: 15px/1.4 var(--tekst); overscroll-behavior: none; }
body { user-select: none; -webkit-user-select: none; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--goud); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--kop); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }

#app { height: 100%; display: flex; flex-direction: column; }
.kop { display: flex; align-items: center; gap: 10px; padding: 10px 16px 6px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.paardknop { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-align: left; }
.paardknop img { width: 40px; height: 40px; object-fit: contain; }
.paardknop b { display: block; font-family: var(--kop); font-size: 20px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paardknop small { display: block; color: var(--inkt2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.munten { display: flex; align-items: center; gap: 6px; background: var(--vlak2); border: 1px solid var(--lijn); border-radius: 999px; padding: 4px 12px 4px 6px; font-family: var(--kop); font-size: 18px; font-weight: 700; color: var(--goud); font-variant-numeric: tabular-nums; }
.munten img { width: 24px; height: 24px; }
.rond { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--vlak2); border: 1px solid var(--lijn); }
.rond svg { width: 22px; height: 22px; fill: var(--inkt2); }

main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.tab { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 10px; }

.scene-kader { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid #070a12; box-shadow: 0 6px 18px rgba(0,0,0,.45); background: #070a12; }
#kooi { display: block; width: 100%; height: auto; touch-action: manipulation; }
.klokje { position: absolute; right: 8px; top: 8px; font: 700 12px var(--kop); color: #fff; background: rgba(7,10,18,.6); padding: 2px 8px; border-radius: 999px; letter-spacing: 0.04em; pointer-events: none; }
.bak-naam { position: absolute; left: 8px; top: 8px; font: 700 12px var(--kop); color: #fff; background: rgba(7,10,18,.6); padding: 2px 8px; border-radius: 999px; pointer-events: none; max-width: calc(100% - 136px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.bewoners { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.bewoners::-webkit-scrollbar { display: none; }
.bewoners:empty { display: none; }
.bewoner { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--vlak); border: 1px solid var(--lijn); white-space: nowrap; font-size: 13px; flex: none; }
.bewoner img { width: 28px; height: 28px; object-fit: contain; }
.bewoner[aria-pressed="true"] { border-color: var(--goud); background: var(--vlak2); }
.bewoner .waar { color: var(--inkt2); font-size: 11px; }

.melding { margin: 0; min-height: 22px; font-size: 14px; }
.melding .ziek { color: var(--slecht); font-weight: 700; }
.makheid { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; column-gap: 8px; }
.makheid img { width: 22px; height: 22px; }
.makheid .balk { height: 10px; }
.makheid .balk i { background: var(--band); }
.makheid b { font: 700 13px var(--kop); color: var(--band); }
.makheid small { grid-column: 2 / 4; font-size: 11px; color: var(--inkt2); }

.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; }
.meter { display: grid; grid-template-columns: 22px 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center; }
.meter img { grid-row: span 2; width: 22px; height: 22px; object-fit: contain; }
.meter span { font-size: 11px; color: var(--inkt2); display: flex; justify-content: space-between; letter-spacing: 0.02em; }
.meter span b { color: var(--inkt); font-weight: 600; font-variant-numeric: tabular-nums; }
.balk { height: 8px; border-radius: 4px; background: #070a12; overflow: hidden; border: 1px solid #05070d; }
.balk i { display: block; height: 100%; border-radius: 3px; background: var(--goed); transition: width .4s ease; }
.balk i.let { background: var(--let); } .balk i.slecht { background: var(--slecht); }
.stalmeters { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--inkt2); }
.stalmeters span { display: flex; align-items: center; gap: 4px; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 999px; padding: 2px 10px 2px 4px; }
.stalmeters img { width: 20px; height: 20px; object-fit: contain; }
.stalmeters b { color: var(--inkt); font-weight: 600; letter-spacing: 1px; }

.acties { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.actie { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); font-size: 12px; font-weight: 600; min-height: 64px; position: relative; text-align: center; }
.actie img { width: 32px; height: 32px; object-fit: contain; }
.actie .aantal { position: absolute; top: 4px; right: 8px; font-size: 11px; color: var(--inkt2); }
.actie[aria-disabled="true"] { opacity: .45; }

.aanmeld { border-color: var(--goud); background: linear-gradient(135deg, #2a2a20, var(--vlak)); }
.aanmeld .knop2 { color: var(--goud); }
.aanmeldkaart { border-top: 1px solid var(--lijn); padding-top: 6px; margin-top: 6px; }
.knop2.hoofd { background: var(--goud); color: var(--goud-inkt); border-color: var(--goud); }


.hud { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.hud .doel span { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--inkt2); font-variant-numeric: tabular-nums; }
.hud .doel b { color: var(--inkt); font-family: var(--kop); font-size: 16px; }
#miniDoek { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; touch-action: none; border-radius: 12px; background: #070a12; cursor: pointer; }
#zweefDoek { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; touch-action: none; border-radius: 12px; background: #070a12; }
.spelkaart .loon { display: flex; align-items: center; color: var(--goud); }
.spelkaart .loon img { width: 22px; height: 22px; }


.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { white-space: nowrap; padding: 6px 14px; border-radius: 999px; background: var(--vlak); border: 1px solid var(--lijn); font-size: 13px; font-weight: 600; color: var(--inkt2); }
.chip[aria-pressed="true"] { background: var(--goud); color: var(--goud-inkt); border-color: var(--goud); }
.lijst { display: grid; gap: 8px; }
.kaart { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); text-align: left; width: 100%; }
.kaart img { width: 56px; height: 56px; object-fit: contain; border-radius: 10px; background: var(--vlak2); }
.kaart h3 { font-size: 16px; }
.kaart p { margin: 2px 0 0; font-size: 12.5px; color: var(--inkt2); }
.kaart .bezit { font-size: 11.5px; color: var(--goed); margin-top: 2px; }
.prijs { display: flex; align-items: center; gap: 4px; background: var(--goud); color: var(--goud-inkt); font: 700 15px var(--kop); padding: 8px 12px; border-radius: 12px; white-space: nowrap; }
.prijs img { width: 18px; height: 18px; }
.prijs[aria-disabled="true"] { background: var(--vlak2); color: var(--inkt2); }
.knop2 { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--lijn); background: var(--vlak2); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.knop2[aria-disabled="true"] { opacity: .45; }
.hoofdknop { width: 100%; padding: 14px 16px; border-radius: 14px; background: var(--goud); color: var(--goud-inkt); font: 700 18px var(--kop); margin-top: 8px; box-shadow: 0 3px 0 #b38a32; }
.rij { display: flex; gap: 8px; flex-wrap: wrap; }
.label { margin: 10px 0 4px; font: 700 12px var(--kop); letter-spacing: 0.08em; text-transform: uppercase; color: var(--inkt2); }
.uitleg { margin: 4px 0; font-size: 13px; color: var(--inkt2); }
.weetje { background: var(--vlak); border: 1px solid var(--lijn); border-left: 3px solid var(--goud); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; margin-top: 8px; }
.feiten { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0; font-size: 14px; }
.feiten dt { color: var(--inkt2); } .feiten dd { margin: 0; }
.invoer { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--lijn); background: var(--vlak2); color: var(--inkt); font: 600 16px var(--tekst); user-select: text; -webkit-user-select: text; }
.groot-beeld { display: grid; place-items: center; background: var(--vlak); border-radius: 14px; padding: 12px; }
.groot-beeld img { width: 100%; max-width: 288px; height: 150px; object-fit: contain; }

.boek-kop { display: flex; justify-content: space-between; align-items: baseline; }
.boek-kop span { color: var(--inkt2); font-size: 13px; }
.raster { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.dierkaart { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px 8px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); overflow: hidden; }
.dierkaart img { width: 64px; height: 64px; object-fit: contain; }
.dierkaart b { font: 700 13px var(--kop); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dierkaart small { font-size: 11px; color: var(--inkt2); display: flex; align-items: center; gap: 3px; }
.dierkaart.nieuw img { filter: brightness(0.25) saturate(0.4); }
.dierkaart .lint { position: absolute; left: 0; top: 0; width: 100%; height: 4px; }
.modi { display: grid; gap: 8px; }
.modus { text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); }
.modus[aria-pressed="true"] { border-color: var(--goud); background: var(--vlak2); }
.modus b { font-family: var(--kop); font-size: 16px; }
.modus p { margin: 2px 0 0; font-size: 12.5px; color: var(--inkt2); }

nav.onder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); background: #0a0e18; border-top: 1px solid #05070d; }
nav.onder button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; font-size: 11px; font-weight: 600; color: var(--inkt2); }
nav.onder button img { width: 28px; height: 28px; object-fit: contain; }
nav.onder button[aria-selected="true"] { color: var(--goud); }

.vel { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.vel-doek { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.vel-paneel { position: relative; max-height: 88%; overflow-y: auto; background: var(--grond); border-radius: 22px 22px 0 0; border-top: 1px solid var(--lijn); padding: 8px 16px 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.vel-greep { width: 40px; height: 4px; border-radius: 2px; background: var(--lijn); margin: 4px auto 10px; }
.vel-kop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.vel-kop h2 { font-size: 24px; }

.toast { position: fixed; left: 16px; right: 16px; margin: 0 auto; width: fit-content; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; align-items: center; gap: 10px; max-width: 480px; background: #f3efe2; color: #18140c; padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.toast img { width: 32px; height: 32px; object-fit: contain; }
#vel:not([hidden]) + .toast { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


#studio { --gw: min(96vw, 66vh); position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: rgb(8,11,53) linear-gradient(to bottom, rgb(4,5,31) 0%, rgb(6,7,44) calc(50% + var(--gw) * -0.5195), rgb(7,8,46) calc(50% + var(--gw) * -0.4330), rgb(7,9,49) calc(50% + var(--gw) * -0.3463), rgb(8,10,50) calc(50% + var(--gw) * -0.2598), rgb(8,11,52) calc(50% + var(--gw) * -0.1732), rgb(8,11,53) calc(50% + var(--gw) * -0.0866), rgb(8,11,53) calc(50% + var(--gw) * 0.0000), rgb(8,11,52) calc(50% + var(--gw) * 0.0866), rgb(8,10,50) calc(50% + var(--gw) * 0.1732), rgb(7,9,49) calc(50% + var(--gw) * 0.2598), rgb(7,8,47) calc(50% + var(--gw) * 0.3463), rgb(6,7,44) calc(50% + var(--gw) * 0.4330), rgb(5,6,42) calc(50% + var(--gw) * 0.5195), rgb(4,5,31) 100%); transition: opacity .45s ease; }
#studio.weg { opacity: 0; pointer-events: none; }
#studio img { display: block; width: var(--gw); height: auto; animation: studioIn .5s ease both; }
@keyframes studioIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }

</style>
</head>

  S.bonus.reeks = S.bonus.dag === gisteren ? Math.min(7, S.bonus.reeks + 1) : 1;
  S.bonus.dag = vandaag;
  const munten = 20 + 15 * S.bonus.reeks, keus = ['nectar', 'meelwormen', 'fruit'], voer = keus[Math.floor(rnd(S) * keus.length)];
  S.munten += munten; S.voorraad[voer] = (S.voorraad[voer] || 0) + 1;
  return { reeks: S.bonus.reeks, munten, voer, weetje: nieuwWeetje(S, t) };
}

  if (!w) return null;

}


function voorspel(S, nu) {

  for (let t = K.laatsteTik + MIN; t <= tot; t += MIN) {
    K.gebeurd = []; simMinuut(K, t, m);
    for (const id of alle(K)) {
      const p = K.dieren[id];
      if (p.jong && p.jong.fase !== 'jong') continue;
      if (p.honger < 20) noteer(t, 'h' + id, p.naam + ' heeft honger', 'Vul de voerbakjes.');
      if (p.dorst < 20) noteer(t, 'd' + id, p.naam + ' heeft dorst', 'Vul de drinkfles.');
      if (p.plezier < 20 && !p.slaapt) noteer(t, 'p' + id, p.naam + ' verveelt zich', 'Kom even spelen.');
    }
    for (const g of K.gebeurd) {
      if (g.soort === 'ziek') noteer(t, 'z' + g.id, K.dieren[g.id].naam + ' is ziek', ZIEKTES[g.ziekte].naam + '. Kijk wat er nodig is.');
      if (g.soort === 'aanmelding') noteer(t, 'a' + t, 'Een aanmelding', g.n === 1 ? 'Er zoekt een suikereekhoorn een plek in je opvang.' : 'Er zoeken ' + g.n + ' suikereekhoorns een plek in je opvang.');

}





function frisheid(S, t) {

  return d <= 1 ? 1.4 - 0.4 * d : Math.max(0.6, 1 - 0.2 * (d - 1));
}
const frisNaam = (f) => (f > 1.15 ? 'nieuw' : f > 0.85 ? 'gewend' : 'saai');
const SPEELDING = ['klimmen', 'zitten', 'spelen', 'verstoppen'];

  if (speel.length < 2) return { ok: false, reden: 'Er is te weinig om om te hangen. Koop een touw, een tak of een schommel.', winkel: 'spullen' };

  S.kooi.schuif = ((S.kooi.schuif || 0) + 1) % 60;

function luister(S, id, t) {
  const p = S.dieren[id];
  if (!p) return { geluid: null, zin: '' };
  const n = p.naam;
  if (p.jong && p.jong.fase !== 'jong') return { geluid: null, zin: n + ' zit nog bij zijn moeder. Daar hoor je alleen zacht gepiep.' };
  if (p.slaapt) return { geluid: null, zin: n + ' slaapt. Slapend zijn ze helemaal stil.' };
  if (p.band < 20) return { geluid: 'krab', zin: 'Krrr! Dat ratelende geluid maakt een suikereekhoorn die bang is. ' + n + ' kent je nog niet. Draag hem in het buidelzakje en geef een meelworm uit je hand.' };
  if (p.honger < 25 || p.dorst < 25) return { geluid: 'blaf', zin: 'Waf, waf, waf! Blaffen is roepen. ' + n + ' wil dat er iemand komt: kijk of er eten en water is.' };
  if (inKooi(S, t).length < 2) return { geluid: 'blaf', zin: 'Waf, waf! ' + n + ' roept de anderen. Alleen voelt een suikereekhoorn zich niet veilig.' };

  return { geluid: null, zin: n + ' is rustig en stil. Hij went aan je: ' + (p.band < 40 ? 'hij kijkt nog de kat uit de boom.' : 'hij kent je al goed.') };
}




const nachtSleutel = (t) => dagSleutel(t - 12 * UUR);

  const d = new Date(t - 12 * UUR), m = d.getMonth();
  if (m >= 3 && m <= 8) return false;
  return hash2(d.getFullYear(), m * 40 + d.getDate(), 77) < 0.25;
}
const kruikLigt = (S, t) => S.kooi.kruik === nachtSleutel(t);

function plaatsDingen(S) {
  const g = verblijfGeo(S.verblijf), tel = { hang: 0, staand: 0, wand: 0 }, uit = [], sch = S.kooi.schuif || 0;

  ingericht(S).forEach((id, i) => {
    const s = SPUL[id], sg = spulGeo(id);

    else if (s.soort === 'staand') { if (n >= g.staand.length) return; ax = g.staand[(n + sch) % g.staand.length]; ay = g.vloer; }
    else { const p = g.wand[n]; if (!p) return; [ax, ay] = p; }

function route(van, naar) {

  const zet = (soort, a, b, snel) => { const d = Math.hypot(b.x - a.x, b.y - a.y); if (d > 0.5) segs.push({ soort, a, b, duur: d / snel * 1000 }); };
  if (Math.abs(dx) <= 22) { zet(Math.abs(naar.y - van.y) > Math.abs(dx) ? 'klim' : 'kruip', van, naar, ZWEEF.kruip); return segs; }
  const hoog = naar.y - Math.abs(dx) * ZWEEF.helling;
  let p = { x: van.x, y: van.y };
  if (p.y > hoog) {

    const vak = g.klim.slice().sort((a, b) => Math.abs(clamp(p.x, a[0] + 6, a[2] - 6) - p.x) - Math.abs(clamp(p.x, b[0] + 6, b[2] - 6) - p.x))[0];
    const gx = clamp(p.x, vak[0] + 6, vak[2] - 6), top = Math.max(vak[1] + 6, hoog);
    if (Math.abs(gx - p.x) > 1) { const q = { x: gx, y: clamp(p.y, vak[1] + 6, vak[3] - 4) }; zet(Math.abs(gx - p.x) > 22 ? 'zweef' : 'kruip', p, q, Math.abs(gx - p.x) > 22 ? ZWEEF.snel : ZWEEF.kruip); p = q; }

function opSegment(sg, f) {

  if (sg.soort === 'zweef') y += 7 * Math.sin(Math.PI * f) - 3 * Math.max(0, f - 0.8) / 0.2;

}


const PLEK_VOOR = { eten: ['eten'], drinken: ['drinken'], rennen: ['rennen'], rusten: ['rusten', 'slapen'], slapen: ['slapen'] };
function kiesPlek(id, b, z) {

  let kandidaten = soorten ? Kooi.plekken.filter((q) => soorten.includes(q.soort)) : [];
  if (soorten && kandidaten.length) {

    if (b.slaapt || b.bezig === 'rusten') return kandidaten[0];
    return kandidaten.slice().sort((p, q) => Math.hypot(p.x - z.x, p.y - z.y) - Math.hypot(q.x - z.x, q.y - z.y))[0];
  }

  kandidaten = Kooi.plekken.filter((q) => ['zitten', 'klimmen', 'gaas', 'spelen', 'verstoppen'].includes(q.soort) && Math.abs(q.x - z.x) > 10);
  return kandidaten[Math.floor(Math.random() * kandidaten.length)] || Kooi.plekken[0];
}
function werkKooiBij(S, nu, dt) {
  const t = Date.now(), ids = inKooi(S, t);
  for (const id of ids) {
    const b = S.dieren[id];
    let z = Kooi.beeld[id];
    if (!z) {
      const p = kiesPlek(id, b, { x: Kooi.W / 2, y: Kooi.H / 2 }) || { x: Kooi.W / 2, y: Kooi.H / 2 };
      z = Kooi.beeld[id] = { x: p.x, y: p.y, plek: p, segs: [], seg: 0, f: 0, wacht: nu + 1500 + Math.random() * 3000, richting: Math.random() < 0.5 ? -1 : 1, staat: '', alfa: 1 };
    }

    if (staat !== z.staat || (staat === 'rond' && !z.segs.length && nu > z.wacht)) {

      if (Math.abs(p.x - z.x) > 0.05) z.richting = p.x > z.x ? 1 : -1;
      z.x = p.x; z.y = p.y; z.soort = sg.soort;

    }

    const binnen = !z.segs.length && z.plek && (z.plek.soort === 'slapen' || z.plek.soort === 'verstoppen') && (b.slaapt || b.bezig === 'rusten' || z.plek.soort === 'verstoppen');

function houding(b, z) {
  if (z.segs.length && z.soort === 'zweef') return 'zweef';
  if (z.segs.length && z.soort === 'klim') return 'klim';
  if (!z.segs.length && z.plek) {
    if (z.plek.soort === 'eten' && b.bezig === 'eten') return 'eet';

    if ((z.plek.soort === 'slapen' || z.plek.soort === 'rusten') && (b.slaapt || b.bezig === 'rusten')) return 'slaap';

function tekenKooi(S, cv, nu) {

    if (vak) Kooi.vakken.push({ id, x0: vak.x0 - 4, y0: vak.y0 - 4, x1: vak.x1 + 4, y1: vak.y1 + 4 });

  Kooi.deeltjes = Kooi.deeltjes.filter((q) => {

const ZW = { W: 320, H: 180, grond: 150, x: 84, vlak: 0.3, duik: 72, snelVlak: 66, snelMax: 124, duikVers: 50, rem: 26, lift: 1.1, klim: 26, top: 30,

function zweefRnd(st) { st.zaad = (st.zaad * 16807) % 2147483647; return (st.zaad - 1) / 2147483646; }
function zweefNieuw(zaad) {
  const st = { zaad: (zaad % 2147483646) + 1, t: 0, afstand: 0, staat: 'klim', y: 96, vy: 0, vx: ZW.snelVlak, druk: false, bomen: 0, motten: 0, bloemen: 0,

function waarTekst(S, id) {
  const p = S.dieren[id], t = Date.now();
  if (p.buidel > t) return 'bij jou';
  if (p.jong && p.jong.fase === 'buidel') return 'in de buidel';
  if (p.jong && p.jong.fase === 'nest') return 'in het nest';
  if (p.slaapt) return 'slaapt';
  return p.bezig ? { eten: 'eet', drinken: 'drinkt', rennen: 'rent', rusten: 'rust' }[p.bezig] : 'klimt';
}
function renderBewoners() {
  const el = $('bewonersRij'), ids = alle(S);
  el.innerHTML = ids.map((id) => '<button class="bewoner" data-kies="' + id + '" aria-pressed="' + (S.gekozen === id) + '"><img class="px" src="' + kopUrl(id) + '" alt="">' + esc(S.dieren[id].naam) + ' <span class="waar">' + waarTekst(S, id) + '</span></button>').join('');
}
function statusTekst(S, p, id) {
  const n = esc(p.naam), t = Date.now();
  if (p.buidel > t) return n + ' ligt lekker in je buidelzakje (nog ' + Math.ceil((p.buidel - t) / MIN) + ' min).';
  if (p.jong && p.jong.fase === 'buidel') return n + ' groeit in de buidel van ' + esc(S.dieren[p.jong.moeder] ? S.dieren[p.jong.moeder].naam : 'zijn moeder') + ' (nog ' + uurTekst2(urenTot(p.jong.tot, t)) + ').';
  if (p.jong && p.jong.fase === 'nest') return n + ' is uit de buidel en blijft nog in het nest (nog ' + uurTekst2(urenTot(p.jong.tot, t)) + ').';
  if (p.ziek) return '<span class="ziek">' + n + ' is ziek: ' + esc(ZIEKTES[p.ziek].naam.toLowerCase()) + '.</span> ' + esc(ZIEKTES[p.ziek].tekst);
  if (p.slaapt) return n + ' slaapt in het slaapzakje. Het is nacht.';
  if (alle(S).length < 2) return n + ' is alleen, en dat vindt een suikereekhoorn niet fijn. Zoek een maatje in de winkel.';
  if (p.dorst < 25) return n + ' heeft dorst. Vul de drinkfles.';
  if (p.honger < 25) return n + ' heeft honger. Vul de voerbakjes.';
  if (p.calcium < 30) return n + ' krijgt te weinig calcium. Insecten met calciumpoeder helpen.';
  if (S.kooi.vuil >= 8) return 'Het verblijf is vies. Tijd om schoon te maken.';
  if (p.band < 20) return n + ' is nog schuw en moet aan je wennen. Rustig samen zijn helpt.';
  const st = stemming(p);
  if (st > 85) return n + ' is superblij!';
  if (st > 65) return n + ' is tevreden.';
  return n + ' kan wel wat aandacht gebruiken.';
}
function balkHtml(v) {
  const f = clamp(v / 100, 0, 1);
  return '<div class="balk"><i class="' + (f < 0.25 ? 'slecht' : f < 0.5 ? 'let' : '') + '" style="width:' + (f * 100).toFixed(0) + '%"></i></div>';
}
function renderMeters() {
  const p = S.dieren[S.gekozen];
  if (!p) return;
  $('melding').innerHTML = statusTekst(S, p, S.gekozen);
  $('band').innerHTML = '<img class="px" src="' + sprUrl('iconen/hart') + '" alt=""><div class="balk"><i style="width:' + p.band.toFixed(0) + '%"></i></div><b>' + Math.floor(p.band) + '</b><small>Band: ' + bandNaam(p.band) + '. Aandacht maakt jullie maatjes (een hapje, het buidelzakje, goed verzorgen); verwaarlozen maakt schuw.</small>';
  $('meters').innerHTML = BEHOEFTEN.map((x) => '<div class="meter"><img class="px" src="' + sprUrl(x.icoon) + '" alt=""><span>' + x.naam + '<b>' + Math.round(p[x.id]) + '</b></span>' + balkHtml(p[x.id]) + '</div>').join('');
  const k = S.kooi, bak = (n) => '●'.repeat(Math.ceil(k.bak[n])) + '○'.repeat(3 - Math.ceil(k.bak[n]));
  $('kooiMeters').innerHTML = '<span><img class="px" src="' + sprUrl('voer/water') + '" alt="">water <b>' + Math.round(k.water) + '%</b></span>' +
    '<span><img class="px" src="' + sprUrl('voer/nectar') + '" alt="">nectar <b>' + bak('nectar') + '</b></span>' +
    '<span><img class="px" src="' + sprUrl('voer/meelwormen') + '" alt="">insecten <b>' + bak('insect') + (k.bak.insect > 0 && k.gestoven ? ' +Ca' : '') + '</b></span>' +
    '<span><img class="px" src="' + sprUrl('voer/fruit') + '" alt="">fruit <b>' + bak('fruit') + '</b></span>' +
    '<span><img class="px" src="' + sprUrl('iconen/schoon') + '" alt="">vuil <b>' + Math.round(k.vuil) + '</b></span>' +
    '<span><img class="px" src="' + sprUrl('iconen/kooi') + '" alt="">speelgoed <b>' + frisNaam(frisheid(S, Date.now())) + '</b></span>' +
    (koudeNacht(Date.now()) ? '<span><img class="px" src="' + sprUrl('iconen/maan') + '" alt="">' + (kruikLigt(S, Date.now()) ? 'kruik <b>ligt erin</b>' : '<b>koude nacht!</b>') + '</span>' : '');
}
function acties() {
  const p = S.dieren[S.gekozen], t = Date.now();
  if (!p) return [];
  return [
    { id: 'voeren', naam: 'Voeren', icoon: 'voer/nectar', tel: VOER.reduce((n, v) => n + (S.voorraad[v.id] || 0), 0) },
    { id: 'water', naam: 'Water', icoon: 'voer/water' },
    { id: 'snoepje', naam: 'Meelworm', icoon: 'voer/meelwormen', tel: S.voorraad.meelwormen || 0 },
    { id: 'schoon', naam: 'Schoonmaken', icoon: 'iconen/schoon' },
    { id: 'buidel', naam: p.buidel > t ? 'Terug' : 'Buidelzakje', icoon: 'iconen/buidel' },
    { id: 'inrichten', naam: 'Inrichten', icoon: 'iconen/kooi' },
    { id: 'dokter', naam: 'Dierenarts', icoon: 'iconen/dokter', uit: !p.ziek },
    { id: 'licht', naam: isNacht(t) ? 'Nacht' : 'Maanlamp', icoon: isNacht(t) ? 'iconen/maan' : 'iconen/maan' },
  ].concat(koudeNacht(t) && !kruikLigt(S, t) ? [{ id: 'kruik', naam: 'Warme kruik', icoon: 'spullen/slaapzak_groen' }] : []);
}
function renderActies() {
  $('acties').innerHTML = acties().map((a) => '<button class="actie" data-actie="' + a.id + '"' + (a.uit ? ' aria-disabled="true"' : '') + '><img class="px" src="' + sprUrl(a.icoon) + '" alt="">' + (a.tel != null ? '<span class="aantal">' + a.tel + '</span>' : '') + a.naam + '</button>').join('');
}

function renderAanmelding() {
  const el = $('aanmelding'), a = S.aanmeldingen[0];
  if (!a) { el.innerHTML = ''; return; }
  const n = a.dieren.length;
  el.innerHTML = '<button class="kaart aanmeld" data-aanmeldingen="1"><img class="px" src="' + kopUrl(a.dieren[0].kleur) + '" alt=""><div><h3>' +
    (n === 1 ? 'Er zoekt een suikereekhoorn een plek' : n + ' suikereekhoorns zoeken een plek') + '</h3><p>' + esc(a.reden) +
    (S.aanmeldingen.length > 1 ? ' (en nog ' + (S.aanmeldingen.length - 1) + ' aanmelding)' : '') + '</p></div><span class="knop2">Bekijken</span></button>';
}
function aanmeldingenVel() {
  const t = Date.now();
  if (!S.aanmeldingen.length) { sluitVel(); return; }
  let html = '<p class="uitleg">Mensen die hun suikereekhoorns niet meer kunnen houden, melden ze aan bij de opvang. Een groepje blijft bij elkaar. Je hebt plek voor ' + Math.max(0, verblijf(S).cap - alle(S).length) + ' erbij.</p>';
  html += S.aanmeldingen.map((a) => '<div class="aanmeldkaart"><p class="label">' + esc(a.reden) + '</p><div class="lijst">' +
    a.dieren.map((d) => '<div class="kaart"><img class="px" src="' + sprUrl('dier/' + d.kleur + '_zit') + '" alt=""><div><h3>' + esc(d.naam) + ' ' + (d.geslacht === 'm' ? '♂' : '♀') + '</h3><p>' + esc(KLEUR[d.kleur].naam) + (d.jong ? ' · met een jong in haar buidel' : '') + '</p></div><span></span></div>').join('') +
    '</div><p class="uitleg">Nog ' + Math.max(1, Math.round((a.tot - t) / UUR)) + ' uur, dan vraagt de eigenaar een andere opvang.</p><div class="rij"><button class="knop2 hoofd" data-opnemen="' + a.id + '">Opnemen</button><button class="knop2" data-afwijzen="' + a.id + '">Andere opvang</button></div></div>').join('');
  openVel('Aanmeldingen', html);
}
function renderKooiTab() {
  renderAanmelding(); renderBewoners(); renderMeters(); renderActies();
  $('kooiNaam').textContent = alle(S).length + '/' + verblijf(S).cap + ' · ' + verblijf(S).naam;
  $('klokje').textContent = isNacht(Date.now()) ? 'nacht' : 'maanlamp aan';
}

function doeActie(actie) {
  const id = S.gekozen, p = S.dieren[id], t = Date.now();
  if (!p) return;
  let r;
  if (actie === 'voeren') return voerVel();
  if (actie === 'water') { r = waterGeven(S); if (r.ok) { geluid('water'); melding('De drinkfles is weer vol.', 'voer/water'); } }
  else if (actie === 'snoepje') { r = snoepje(S, id, t); if (r.ok) { geluid('knabbel'); hartjesKooi(id); melding(p.naam + ' pakt de meelworm uit je hand.', 'voer/meelwormen'); nieuwWeetje(S, t, 'hand'); } }
  else if (actie === 'schoon') { r = schoonmaken(S); if (r.ok) { geluid('water'); melding('Poep en gemorst voer eruit, vers zand en schone zakjes. Lekker fris.', 'iconen/schoon'); } }
  else if (actie === 'buidel') { r = inBuidel(S, id, t); if (r.ok) { geluid(r.uit ? 'klik' : 'blaf'); melding(r.uit ? p.naam + ' klimt terug het verblijf in.' : p.naam + ' kruipt in je buidelzakje, dicht bij jou.', 'iconen/buidel'); if (!r.uit) nieuwWeetje(S, t, 'buidelzakje'); } }
  else if (actie === 'inrichten') return inrichtVel();
  else if (actie === 'kruik') { r = legKruik(S, t); if (r.ok) { geluid('beter'); melding('De warme kruik ligt in het nest. Vannacht kruipen ze er lekker tegenaan.', 'spullen/slaapzak_groen'); nieuwWeetje(S, t, 'torpor'); renderActies(); } }
  else if (actie === 'dokter') { r = dierenarts(S, id); if (r.ok) { geluid('beter'); melding(p.naam + ' is weer beter (' + r.prijs + ' munten).', 'iconen/dokter'); } }
  else if (actie === 'licht') { melding(isNacht(t) ? 'Het is nacht: de suikereekhoorns slapen. Na het opstaan gaat de maanlamp weer aan.' : 'De maanlamp is aan: voor de suikereekhoorns is het nu nacht, en dan zijn ze wakker.', 'iconen/maan'); nieuwWeetje(S, t, 'maanlamp'); return; }
  if (r && !r.ok && r.reden) { melding(r.reden); geluid('fout'); if (r.winkel) naarWinkel(r.winkel); }
  if (r && r.ok) tril(15);
  veranderd();
}
function voerVel() {
  const k = S.kooi;
  let html = '<p class="uitleg">Voer gaat in de bakjes op de voerplank; ze eten zelf als ze honger hebben. Een bakje kan drie porties hebben.</p><div class="lijst">';
  html += VOER.map((v) => {
    const n = S.voorraad[v.id] || 0, vol = k.bak[v.bak] >= 3;
    return '<div class="kaart"><img class="px" src="' + sprUrl('voer/' + v.id) + '" alt=""><div><h3>' + esc(v.naam) + '</h3><p>' + esc(v.tekst) + '</p><div class="bezit">in huis: ' + n + ' · bakje ' + v.bak + ': ' + Math.ceil(k.bak[v.bak]) + '/3</div></div>' +
      (n > 0 ? '<button class="knop2" data-voer="' + v.id + '"' + (vol ? ' aria-disabled="true"' : '') + '>In het bakje</button>' : '<button class="prijs" data-koopvoer="' + v.id + '" aria-disabled="' + (S.munten < v.prijs) + '">' + muntImg() + getal(v.prijs) + '</button>') + '</div>';
  }).join('');
  html += '<div class="kaart"><img class="px" src="' + sprUrl('voer/calcium') + '" alt=""><div><h3>Calciumpoeder</h3><p>Over de insecten gestrooid. Zonder calcium worden de botten zwak.</p><div class="bezit">' + (S.calciumpoeder ? 'heb je: elke portie insecten krijgt een snufje' : 'nog niet in huis') + '</div></div>' +
    (S.calciumpoeder ? '<span class="knop2">Heb je</span>' : '<button class="prijs" data-koopcalcium="1" aria-disabled="' + (S.munten < CALCIUM_PRIJS) + '">' + muntImg() + CALCIUM_PRIJS + '</button>') + '</div></div>';
  openVel('Voeren', html);
}
function inrichtVel() {
  const nu = ingericht(S), los = SPULLEN.filter((s) => vrijeSpullen(S, s.id) > 0);
  const fr = frisheid(S, Date.now());
  let html = '<div class="kaart"><img class="px" src="' + sprUrl('iconen/kooi') + '" alt=""><div><h3>Omhangen</h3><p>Het speelgoed hangt er nu ' + (fr > 1.15 ? 'net: alles is nieuw en spannend.' : fr > 0.85 ? 'een tijdje: ze zijn eraan gewend.' : 'al dagen hetzelfde: het is saai geworden.') + ' Hang het anders en ze gaan weer op ontdekking.</p></div><button class="knop2" data-omhangen="1">Omhangen</button></div>' +
    '<p class="uitleg">Aan het dak hangt ' + plekkenVan(S.verblijf, 'hang') + ', op de vloer staat ' + plekkenVan(S.verblijf, 'staand') + ' en aan de wand ' + plekkenVan(S.verblijf, 'wand') + ' dingen. Nieuwe spullen koop je in de winkel.</p>';
  html += '<p class="label">In het verblijf</p><div class="lijst">' + nu.map((id, i) => '<div class="kaart"><img class="px" src="' + sprUrl('spullen/' + id) + '" alt=""><div><h3>' + esc(SPUL[id].naam) + '</h3><p>' + esc(SPUL[id].tekst) + '</p></div><button class="knop2" data-weg="' + i + '">Weghalen</button></div>').join('') + '</div>';
  if (los.length) html += '<p class="label">In de kast</p><div class="lijst">' + los.map((s) => '<div class="kaart"><img class="px" src="' + sprUrl('spullen/' + s.id) + '" alt=""><div><h3>' + esc(s.naam) + ' ×' + vrijeSpullen(S, s.id) + '</h3><p>' + esc(s.tekst) + '</p></div><button class="knop2" data-neer="' + s.id + '">Neerzetten</button></div>').join('') + '</div>';
  openVel('Inrichten', html);
}


function renderSpelen() {
  if (Zweef.actief || Kast.actief) return;
  const el = $('tab-spelen'), p = S.dieren[S.gekozen], Z = S.spel.zweef;
  el.innerHTML = '<h2 style="font-size:22px">Spelen</h2><div class="lijst">' +
    '<button class="kaart spelkaart" data-spel="zweef"><img class="px" src="' + sprUrl('dier/' + kleurVan(S.gekozen) + '_zweef') + '" alt=""><div><h3>Zweeftocht</h3><p>' + esc(p ? p.naam : 'Je suikereekhoorn') + ' zweeft \'s nachts van boom naar boom. Tik om te springen, houd vast om ver te zweven, laat los om te duiken naar motten. Af en toe geeft een windvlaag een zetje.</p>' +
    '<div class="bezit">record: ' + Z.record + ' bomen · ' + Z.gespeeld + ' keer gespeeld</div></div><span class="loon">' + muntImg() + '</span></button>' + miniKaarten() + '</div>';
}
function zweefUitslag(u) {
  const Z = S.spel.zweef, nieuw = u.bomen > Z.record;
  Z.gespeeld++; Z.bomen += u.bomen; if (nieuw) Z.record = u.bomen;
  S.munten += u.munten; S.totaal.verdiendSpel += u.munten;
  veranderd(); renderKop();
  const reden = u.reden === 'grond' ? 'Op de grond is het gevaarlijk voor een suikereekhoorn: daar stopt de tocht.' : u.reden === 'uil' ? 'De uil! Snel terug naar huis.' : '';
  const html = '<div class="groot-beeld"><img class="px" src="' + sprUrl('dier/' + kleurVan(S.gekozen) + '_zweef') + '" alt=""></div>' +
    '<p style="text-align:center;font:700 22px var(--kop);margin:8px 0">' + u.bomen + (u.bomen === 1 ? ' boom' : ' bomen') + (nieuw && u.bomen ? ' · nieuw record!' : '') + '</p>' +
    (reden ? '<p class="uitleg" style="text-align:center">' + esc(reden) + '</p>' : '') +
    '<dl class="feiten"><dt>Motten</dt><dd>' + u.motten + '</dd><dt>Bloemen</dt><dd>' + u.bloemen + '</dd><dt>Munten</dt><dd>' + u.munten + '</dd><dt>Record</dt><dd>' + Z.record + (Z.record === 1 ? ' boom' : ' bomen') + '</dd></dl>' +
    '<div class="rij"><button class="knop2" data-spel="zweef">Nog een keer</button><button class="knop2" data-spelen="1">Klaar</button></div>';
  openVel('Zweeftocht', html);
  renderSpelen();
}


const CATS = [{ id: 'voer', naam: 'Voer' }, { id: 'spullen', naam: 'Spullen' }, { id: 'verblijf', naam: 'Verblijven' }];
function naarWinkel(cat) { sluitVel(); if (Zweef.actief) zweefEinde(true); if (Kast.actief) miniEinde(true); UI.tab = 'winkel'; UI.winkelCat = cat || 'voer'; renderTab(); }
function renderWinkel() {
  const el = $('tab-winkel');
  let html = '<div class="chips">' + CATS.map((c) => '<button class="chip" data-cat="' + c.id + '" aria-pressed="' + (UI.winkelCat === c.id) + '">' + c.naam + '</button>').join('') + '</div><div class="lijst">';
  if (UI.winkelCat === 'voer') {
    html += VOER.map((v) => '<div class="kaart"><img class="px" src="' + sprUrl('voer/' + v.id) + '" alt=""><div><h3>' + esc(v.naam) + '</h3><p>' + esc(v.tekst) + '</p><div class="bezit">' + v.pak + ' porties · in huis: ' + (S.voorraad[v.id] || 0) + '</div></div><button class="prijs" data-koopvoer="' + v.id + '" aria-disabled="' + (S.munten < v.prijs) + '">' + muntImg() + getal(v.prijs) + '</button></div>').join('');
    html += '<div class="kaart"><img class="px" src="' + sprUrl('voer/calcium') + '" alt=""><div><h3>Calciumpoeder</h3><p>Een snufje over de insecten.</p></div>' + (S.calciumpoeder ? '<span class="knop2">Heb je</span>' : '<button class="prijs" data-koopcalcium="1" aria-disabled="' + (S.munten < CALCIUM_PRIJS) + '">' + muntImg() + CALCIUM_PRIJS + '</button>') + '</div>';
  } else if (UI.winkelCat === 'spullen') {
    html += SPULLEN.filter((s) => s.prijs > 0).map((s) => '<div class="kaart"><img class="px" src="' + sprUrl('spullen/' + s.id) + '" alt=""><div><h3>' + esc(s.naam) + '</h3><p>' + esc(s.tekst) + '</p><div class="bezit">' + ({ hang: 'hangt aan het dak', staand: 'staat op de vloer', wand: 'aan de wand' }[s.soort]) + (S.bezit[s.id] ? ' · heb je: ' + S.bezit[s.id] : '') + '</div></div><button class="prijs" data-koopspul="' + s.id + '" aria-disabled="' + (S.munten < s.prijs) + '">' + muntImg() + getal(s.prijs) + '</button></div>').join('');
  } else if (UI.winkelCat === 'verblijf') {
    html += VERBLIJVEN.map((v) => {
      const heb = S.verblijven.includes(v.nr), hier = S.verblijf === v.nr;
      const knop = hier ? '<span class="knop2">Hier woon je</span>' : heb ? '<button class="knop2" data-kiesverblijf="' + v.nr + '">Verhuizen</button>' : '<button class="prijs" data-koopverblijf="' + v.nr + '" aria-disabled="' + (S.munten < v.prijs) + '">' + muntImg() + getal(v.prijs) + '</button>';
      return '<div class="kaart"><img class="px" src="' + sprUrl('verblijven/' + v.nr) + '" alt="" style="object-fit:cover"><div><h3>' + esc(v.naam) + '</h3><p>' + esc(v.tekst) + '</p><div class="bezit">plek voor ' + v.cap + '</div></div>' + knop + '</div>';
    }).join('');
  }
  el.innerHTML = html + '</div>';
}


function renderBoek() {
  const el = $('tab-boek'), eigen = alle(S).sort((a, b) => S.dieren[a].sinds - S.dieren[b].sinds);
  let html = '<div class="boek-kop"><h2>Jouw suikereekhoorns</h2><span>' + eigen.length + '/' + verblijf(S).cap + '</span></div><div class="raster">';
  html += eigen.map((id) => { const p = S.dieren[id]; return '<button class="dierkaart" data-dier="' + id + '"><img class="px" src="' + lijfUrl(id) + '" alt=""><b>' + esc(p.naam) + ' ' + geslachtTeken(p) + '</b><small>' + esc(KLEUR[kleurVan(id)].naam) + '</small><small>' + waarTekst(S, id) + '</small></button>'; }).join('');
  html += '</div><div class="boek-kop" style="margin-top:14px"><h2>Kleurvormen</h2><span>' + new Set(eigen.map(kleurVan)).size + ' van ' + KLEUREN.length + '</span></div><div class="raster">';
  html += KLEUREN.map((k) => { const heb = eigen.some((id) => kleurVan(id) === k.id); return '<button class="dierkaart' + (heb ? '' : ' nieuw') + '" data-kleur="' + k.id + '"><span class="lint" style="background:' + ZELDZAAMHEID[k.z].kleur + '"></span><img class="px" src="' + sprUrl('dier/' + k.id + '_zit') + '" alt=""><b>' + esc(k.naam) + '</b><small>' + (heb ? 'in je opvang' : ZELDZAAMHEID[k.z].naam.toLowerCase()) + '</small></button>'; }).join('');
  const bekend = WEETJES.filter((w) => S.weetjes.includes(w.id));
  html += '</div><div class="boek-kop" style="margin-top:14px"><h2>Weetjes</h2><span>' + bekend.length + ' van ' + WEETJES.length + '</span></div>';

    '<div class="lijst"><div class="kaart"><img class="px" src="' + sprUrl('iconen/munt') + '" alt=""><div><h3>' + b.munten + ' munten</h3><p>Een gift voor de opvang. Morgen weer komen = meer (tot 7 dagen).</p></div><span></span></div>' +
    '<div class="kaart"><img class="px" src="' + sprUrl('voer/' + b.voer) + '" alt=""><div><h3>1× ' + esc(v.naam.toLowerCase()) + '</h3><p>' + esc(v.tekst) + '</p></div><span></span></div></div>' +
    (b.weetje ? '<div class="weetje"><b>Weetje van de dag:</b> ' + esc(b.weetje.tekst) + '</div>' : '') + '<button class="hoofdknop" data-sluit>Dank je!</button>';
  setTimeout(() => { if ($('vel').hidden) { openVel('Dagbonus', html); geluid('munt'); } }, 700);
  veranderd();
}
window.terugKnop = () => {
  if (!$('vel').hidden) { sluitVel(); return true; }
  if (Zweef.actief) { zweefEinde(true); return true; }
  if (Kast.actief) { miniEinde(true); return true; }
  if (UI.tab !== 'kooi') { UI.tab = 'kooi'; renderTab(); renderAlles(); return true; }
  return false;
};

async function start() {
  await laadSprites();
  try { const i = JSON.parse(localStorage.getItem('lesuikaer_inst') || 'null'); if (i) Object.assign(UI.instellingen, i); } catch (e) {  }
  ouderStart();
  const nu = Date.now();
  S = laadStaat();
  if (!S || !(S.v <= STAAT_VERSIE)) S = nieuweStaat(nu);
  else { herstelStaat(S, nu); S.v = STAAT_VERSIE; }
  const r = inhalen(S, nu);
  document.querySelectorAll('[data-icoon]').forEach((img) => { img.src = sprUrl(img.dataset.icoon); });
  $('muntIcoon').src = sprUrl('iconen/munt');
  document.addEventListener('click', (e) => { audioStart(); klik(e); });
  const lokaal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const demo = lokaal && location.hash.length > 1 ? location.hash.slice(1) : '';
  if (demo) zetDemo(demo);
  renderAlles(); renderTab();
  if (!demo && !S.welkom) welkomVel();
  else if (!demo) { if (r.minuten > 60) welkomTerug(r); toonDagBonus(); }
  if (demo) naDemo(demo);
  bewaarNu();

  let laatsteSim = 0, laatsteUi = 0, laatsteScene = 0;
  const lus = (t) => {
    requestAnimationFrame(lus);
    const klok = Date.now();
    if (klok - laatsteSim > 1000) {
      laatsteSim = klok;
      const rr = inhalen(S, klok);
      if (rr.minuten) {
        UI.vuil = true; bewaarStraks();
        for (const g of rr.gebeurd) {
          const z = gebeurtenisTekst(g);
          if (z) melding(z, g.soort === 'ziek' ? 'iconen/dokter' : kopUrl(g.id || S.gekozen));
          nieuwsWeetje(g);
          if (g.soort === 'aanmelding') geluid('blaf');
        }
      }
    }
    if (UI.vuil && t - laatsteUi > 250 && !UI.velOpen) { laatsteUi = t; renderAlles(); }
    if (document.hidden) return;
    if (t - laatsteScene > 33) {
      laatsteScene = t;
      if (UI.tab === 'kooi') tekenKooi(S, $('kooi'), t);
    }
  };
  requestAnimationFrame(lus);
  document.addEventListener('visibilitychange', () => { if (document.hidden) window.appPauze(); else window.appHervat(); });
  window.addEventListener('pagehide', () => window.appPauze());
}



function zetDemo(soort) {
  const nu = Date.now();
  S = nieuweStaat(nu); S.welkom = true; S.modus = 'normaal'; S.bonus.dag = dagSleutel(nu);
  const m = /^(\w+?)(\d+)?$/.exec(soort) || [], wat = m[1] || soort, nr = Number(m[2] || 0);
  if (wat !== 'nacht') isNacht = () => false;
  if (['rijk', 'verblijf', 'aanmelding', 'jong'].includes(wat)) {
    S.munten = 1e6;
    for (let n = 2; n <= VERBLIJVEN.length; n++) koopVerblijf(S, n);
    kiesVerblijf(S, nr && wat === 'verblijf' ? nr : 3);
    for (const s of SPULLEN) if (s.prijs > 0 && Math.random() < 0.7) koopSpul(S, s.id);
    S.calciumpoeder = true; S.voorraad = { nectar: 12, gom: 4, meelwormen: 12, krekels: 4, fruit: 6, groente: 6 };
    S.munten = 25000;
  }
  if (wat === 'rijk' || wat === 'verblijf' || wat === 'jong') {
    S.dieren.grijs.band = 80; S.dieren['grijs~2'].band = 60;
    for (const [k, g, n] of [['platinum', 'm', 'Mango'], ['leucistisch', 'v', 'Nova'], ['creamino', 'v', 'Kiwi'], ['mosaic', 'm', 'Bo']]) {
      const id = vrijeId(S, k); S.dieren[id] = nieuwDier(id, nu - 3 * DAG, { naam: n, geslacht: g, band: 50 });
    }
  }
  if (wat === 'jong') metJong(S, 'leucistisch', nu);
  if (wat === 'aanmelding') { S.volgendeAanmelding = 0; nieuweAanmelding(S, nu); nieuweAanmelding(S, nu + 1); }
  if (wat === 'ziek') { S.dieren.grijs.ziek = 'calcium'; S.dieren.grijs.calcium = 12; }
  if (wat.startsWith('spel')) UI.tab = 'spelen';
  bewaarNu = () => {};
}
function naDemo(soort) {
  if (soort.startsWith('aanmelding')) setTimeout(aanmeldingenVel, 300);
  if (soort.startsWith('spel')) setTimeout(() => {
    startZweef($('tab-spelen'), 'grijs', { record: 0 });
    if (soort !== 'spelwind') return;


    const st = Zweef.st;
    while (st.y > st.op.top + 6.5) zweefStap(st, 1 / 120);
    zweefDruk(st, true);
    for (let i = 0; i < 40; i++) zweefStap(st, 1 / 120);
    st.wind.t0 = st.t; st.wind.gemeld = true; st.wind.aantal = 1;
    for (let i = 0; i < 96; i++) zweefStap(st, 1 / 120);
    st.klaar = true;
  }, 300);
}

start();
