<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Le Pærde</title>
<style>

:root {
  --grond: #1c1511; --vlak: #2a2018; --vlak2: #382b20; --lijn: #52402f;
  --inkt: #f6efe3; --inkt2: #c2b09a; --goud: #ffd24d; --goud-inkt: #2b2106;
  --gras: #6fbf4a; --water: #5cc8f2; --goed: #7ed957; --let: #ffb547; --slecht: #ff6b5e; --mak: #e39b4a;
  --kop: "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", sans-serif;
  --tekst: Roboto, "sans-serif", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--grond); color: var(--inkt); font: 15px/1.4 var(--tekst); overscroll-behavior: none; }
body { user-select: none; -webkit-user-select: none; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--goud); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--kop); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }

#app { height: 100%; display: flex; flex-direction: column; }
.kop { display: flex; align-items: center; gap: 10px; padding: 10px 16px 6px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.paardknop { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-align: left; }
.paardknop img { width: 40px; height: 40px; object-fit: contain; }
.paardknop b { display: block; font-family: var(--kop); font-size: 20px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paardknop small { display: block; color: var(--inkt2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.munten { display: flex; align-items: center; gap: 6px; background: var(--vlak2); border: 1px solid var(--lijn); border-radius: 999px; padding: 4px 12px 4px 6px; font-family: var(--kop); font-size: 18px; font-weight: 700; color: var(--goud); font-variant-numeric: tabular-nums; }
.munten img { width: 24px; height: 24px; }
.rond { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--vlak2); border: 1px solid var(--lijn); }
.rond svg { width: 22px; height: 22px; fill: var(--inkt2); }

main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.tab { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 10px; }

.wissel { display: flex; gap: 6px; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 999px; padding: 3px; align-self: center; }
.wissel button { padding: 6px 22px; border-radius: 999px; font: 700 15px var(--kop); color: var(--inkt2); }
.wissel button[aria-pressed="true"] { background: var(--goud); color: var(--goud-inkt); }

.scene-kader { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid #0e0a08; box-shadow: 0 6px 18px rgba(0,0,0,.4); background: #0e0a08; }
.stal-rol { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
.stal-rol::-webkit-scrollbar { display: none; }
#stal { display: block; height: auto; aspect-ratio: auto; touch-action: pan-x; }
#wei { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; touch-action: none; }
.klokje { position: absolute; right: 8px; top: 8px; font: 700 12px var(--kop); color: #fff; background: rgba(14,10,8,.6); padding: 2px 8px; border-radius: 999px; letter-spacing: 0.04em; pointer-events: none; }
.bak-naam { position: absolute; left: 8px; top: 8px; font: 700 12px var(--kop); color: #fff; background: rgba(14,10,8,.6); padding: 2px 8px; border-radius: 999px; pointer-events: none; }

.bewoners { display: flex; gap: 8px; overflow-x: auto; }
.bewoners:empty { display: none; }
.bewoner { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--vlak); border: 1px solid var(--lijn); white-space: nowrap; font-size: 13px; }
.bewoner img { width: 28px; height: 28px; object-fit: contain; }
.bewoner[aria-pressed="true"] { border-color: var(--goud); background: var(--vlak2); }
.bewoner .waar { color: var(--inkt2); font-size: 11px; }

.melding { margin: 0; min-height: 22px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.melding .ziek { color: var(--slecht); font-weight: 700; }

.makheid { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; column-gap: 8px; }
.makheid img { width: 22px; height: 22px; }
.makheid .balk { height: 10px; }
.makheid .balk i { background: var(--mak); }
.makheid b { font: 700 13px var(--kop); color: var(--mak); }
.makheid small { grid-column: 2 / 4; font-size: 11px; color: var(--inkt2); }

.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; }
.meter { display: grid; grid-template-columns: 22px 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center; }
.meter img { grid-row: span 2; width: 22px; height: 22px; }
.meter span { font-size: 11px; color: var(--inkt2); display: flex; justify-content: space-between; letter-spacing: 0.02em; }
.meter span b { color: var(--inkt); font-weight: 600; font-variant-numeric: tabular-nums; }
.balk { height: 8px; border-radius: 4px; background: #110c09; overflow: hidden; border: 1px solid #0a0705; }
.balk i { display: block; height: 100%; border-radius: 3px; background: var(--goed); transition: width .4s ease; }
.balk i.let { background: var(--let); } .balk i.slecht { background: var(--slecht); }
.stalmeters { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--inkt2); }
.stalmeters span { display: flex; align-items: center; gap: 4px; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 999px; padding: 2px 10px 2px 4px; }
.stalmeters img { width: 20px; height: 20px; }
.stalmeters b { color: var(--inkt); }

.acties { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.actie { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); font-size: 12px; font-weight: 600; min-height: 64px; position: relative; }
.actie img { width: 32px; height: 32px; }
.actie .aantal { position: absolute; top: 4px; right: 8px; font-size: 11px; color: var(--inkt2); }
.actie[aria-disabled="true"] { opacity: .45; }


.rit-kop { display: flex; gap: 12px; align-items: center; }
.rit-kop img { width: 96px; height: 96px; }
.rit-kop h2 { font-size: 22px; }
.rit-kop p { margin: 2px 0 0; color: var(--inkt2); font-size: 13px; }
.rit-kader { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid #0e0a08; background: #0e0a08; }
#ritBalk { display: block; width: 100%; height: auto; aspect-ratio: 320 / 72; }
.rit-tijd { position: absolute; right: 8px; top: 6px; font: 700 13px var(--kop); color: #fff; background: rgba(14,10,8,.6); padding: 2px 8px; border-radius: 999px; }
.routes { display: grid; gap: 8px; }
.route { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); }
.route h3 { font-size: 16px; }
.route p { margin: 0; font-size: 12.5px; color: var(--inkt2); grid-column: 1; }
.route .loon { grid-row: 1 / 3; font: 700 15px var(--kop); color: var(--goud); display: flex; align-items: center; gap: 4px; }
.route .loon img { width: 18px; height: 18px; }
.route[aria-disabled="true"] { opacity: .5; }
.opruimknop { background: var(--let); color: #2b1a06; font: 700 18px var(--kop); padding: 14px; border-radius: 14px; width: 100%; box-shadow: 0 3px 0 #b36f12; animation: klop .9s ease-in-out infinite; }
@keyframes klop { 50% { transform: scale(1.03); } }
.pluspunten { display: flex; align-items: center; gap: 8px; font: 700 15px var(--kop); color: var(--gras); }
.pluspunten img { width: 24px; height: 24px; }


.rozet { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--rozet); border: 2px solid rgba(255,255,255,.55); box-shadow: 0 0 0 1px rgba(0,0,0,.4); vertical-align: -2px; position: relative; }
.rozet::after { content: ''; position: absolute; left: 50%; top: 100%; width: 4px; height: 7px; margin-left: -2px; background: var(--rozet); opacity: .8; }
.rozet.groot { width: 34px; height: 34px; border-width: 4px; flex: none; }
.rozet.groot::after { width: 8px; height: 14px; margin-left: -4px; }
.rozetten { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--inkt2); }
.lintje { display: inline-block; width: 14px; height: 30px; background: var(--inkt2); border-radius: 2px; flex: none; }
.uitslag { display: flex; gap: 14px; align-items: center; }
.wedstrijd-bezig { border-color: var(--goud); }
.dek { display: inline-flex; align-items: center; gap: 6px; }
.dek img { width: 22px; height: 22px; }


.borstel-kader { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid #0e0a08; background: #0e0a08; }
#borstelDoek { display: block; width: 100%; height: auto; aspect-ratio: 240 / 200; touch-action: none; }


.segment { display: grid; grid-template-columns: 1fr 1fr; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 12px; padding: 3px; }
.segment button { padding: 8px; border-radius: 9px; font-weight: 700; font-size: 14px; }
.segment.drie { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.segment.drie button { font-size: 13px; padding: 8px 4px; }
.segment button[aria-pressed="true"] { background: var(--goud); color: var(--goud-inkt); }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.level { padding: 10px 6px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.level b { font-family: var(--kop); font-size: 22px; }
.level .sterren { font-size: 11px; color: var(--let); letter-spacing: 1px; }
.level .loon { display: flex; align-items: center; gap: 3px; font-size: 12.5px; color: var(--goud); font-weight: 700; }
.level .loon img { width: 14px; height: 14px; }
.level.gehaald { border-color: #7a6a3b; }
.hud { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.hud .zetten { font-family: var(--kop); font-size: 26px; font-weight: 700; text-align: center; min-width: 48px; line-height: 1; }
.hud .zetten small { display: block; font-size: 10px; color: var(--inkt2); font-weight: 600; letter-spacing: .05em; }
.hud .doel span { display: flex; justify-content: space-between; font-size: 12px; color: var(--inkt2); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.hud .doel .balk { height: 12px; border-radius: 6px; }
#bord { display: block; width: 100%; aspect-ratio: 1; touch-action: none; border-radius: 12px; background: #231a13; }

#springDoek { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; touch-action: none; border-radius: 12px; background: #231a13; image-rendering: pixelated; }
#tab-rit .hud .balk i { display: block; height: 100%; border-radius: inherit; background: var(--goud); }


.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chip { white-space: nowrap; padding: 6px 14px; border-radius: 999px; background: var(--vlak); border: 1px solid var(--lijn); font-size: 13px; font-weight: 600; color: var(--inkt2); }
.chip[aria-pressed="true"] { background: var(--goud); color: var(--goud-inkt); border-color: var(--goud); }
.lijst { display: grid; gap: 8px; }
.kaart { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); text-align: left; }
.kaart img { width: 56px; height: 56px; object-fit: contain; border-radius: 10px; background: var(--vlak2); }
.kaart h3 { font-size: 16px; }
.kaart p { margin: 2px 0 0; font-size: 12.5px; color: var(--inkt2); }
.kaart .bezit { font-size: 11.5px; color: var(--gras); margin-top: 2px; }
.prijs { display: flex; align-items: center; gap: 4px; background: var(--goud); color: var(--goud-inkt); font: 700 15px var(--kop); padding: 8px 12px; border-radius: 12px; white-space: nowrap; }
.prijs img { width: 18px; height: 18px; }
.prijs[aria-disabled="true"] { background: var(--vlak2); color: var(--inkt2); }
.knop2 { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--lijn); background: var(--vlak2); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.knop2[aria-disabled="true"] { opacity: .45; }
.hoofdknop { width: 100%; padding: 14px 16px; border-radius: 14px; background: var(--goud); color: var(--goud-inkt); font: 700 18px var(--kop); margin-top: 8px; box-shadow: 0 3px 0 #b38a12; }
.hoofdknop[aria-disabled="true"] { background: var(--vlak2); color: var(--inkt2); box-shadow: none; }
.rij { display: flex; gap: 8px; flex-wrap: wrap; }
.label { margin: 10px 0 4px; font: 700 12px var(--kop); letter-spacing: 0.08em; text-transform: uppercase; color: var(--inkt2); }
.weetje { background: var(--vlak); border: 1px solid var(--lijn); border-left: 3px solid var(--goud); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; margin-top: 8px; }
.feiten { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0; font-size: 14px; }
.feiten dt { color: var(--inkt2); } .feiten dd { margin: 0; }
.invoer { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--lijn); background: var(--vlak2); color: var(--inkt); font: 600 16px var(--tekst); }
.groot-beeld { display: grid; place-items: center; background: var(--vlak); border-radius: 14px; padding: 12px; }
.groot-beeld img { width: 100%; max-width: 288px; height: 150px; object-fit: contain; }

.boek-kop { display: flex; justify-content: space-between; align-items: baseline; }
.boek-kop span { color: var(--inkt2); font-size: 13px; }
.raster { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.paardkaart { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px 8px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); overflow: hidden; }
.paardkaart img { width: 64px; height: 64px; object-fit: contain; }
.paardkaart b { font: 700 13px var(--kop); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.paardkaart small { font-size: 11px; color: var(--inkt2); display: flex; align-items: center; gap: 3px; }
.paardkaart small img { width: 14px; height: 14px; }
.paardkaart.nieuw img { filter: brightness(0.25) saturate(0.4); }
.paardkaart .lint { position: absolute; left: 0; top: 0; width: 100%; height: 4px; }
.paardkaart .ster { position: absolute; right: 6px; top: 6px; width: 16px; height: 16px; }
.modi { display: grid; gap: 8px; }
.modus { text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); }
.modus[aria-pressed="true"] { border-color: var(--goud); background: var(--vlak2); }
.modus b { font-family: var(--kop); font-size: 16px; }
.modus p { margin: 2px 0 0; font-size: 12.5px; color: var(--inkt2); }

nav.onder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 6px 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); background: #150f0c; border-top: 1px solid #0e0a08; }
nav.onder button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; font-size: 11px; font-weight: 600; color: var(--inkt2); }
nav.onder button img { width: 28px; height: 28px; }
nav.onder button[aria-selected="true"] { color: var(--goud); }

.vel { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.vel-doek { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.vel-paneel { position: relative; max-height: 88%; overflow-y: auto; background: var(--grond); border-radius: 22px 22px 0 0; border-top: 1px solid var(--lijn); padding: 8px 16px 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.vel-greep { width: 40px; height: 4px; border-radius: 2px; background: var(--lijn); margin: 4px auto 10px; }
.vel-kop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.vel-kop h2 { font-size: 24px; }

.toast { position: fixed; left: 16px; right: 16px; margin: 0 auto; width: fit-content; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; align-items: center; gap: 10px; max-width: 480px; background: #f6efe3; color: #1c1511; padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.toast img { width: 32px; height: 32px; }


#studio { --gw: min(96vw, 66vh); position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: rgb(8,11,53) linear-gradient(to bottom, rgb(4,5,31) 0%, rgb(6,7,44) calc(50% + var(--gw) * -0.5195), rgb(7,8,46) calc(50% + var(--gw) * -0.4330), rgb(7,9,49) calc(50% + var(--gw) * -0.3463), rgb(8,10,50) calc(50% + var(--gw) * -0.2598), rgb(8,11,52) calc(50% + var(--gw) * -0.1732), rgb(8,11,53) calc(50% + var(--gw) * -0.0866), rgb(8,11,53) calc(50% + var(--gw) * 0.0000), rgb(8,11,52) calc(50% + var(--gw) * 0.0866), rgb(8,10,50) calc(50% + var(--gw) * 0.1732), rgb(7,9,49) calc(50% + var(--gw) * 0.2598), rgb(7,8,47) calc(50% + var(--gw) * 0.3463), rgb(6,7,44) calc(50% + var(--gw) * 0.4330), rgb(5,6,42) calc(50% + var(--gw) * 0.5195), rgb(4,5,31) 100%); transition: opacity .45s ease; }
#studio.weg { opacity: 0; pointer-events: none; }
#studio img { display: block; width: var(--gw); height: auto; animation: studioIn .5s ease both; }
@keyframes studioIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }

</style>

function bol(ramp, onderrand = true) {
  return (nx, ny) => {
    const licht = nx * -0.55 + ny * -0.8, r2 = nx * nx + ny * ny;
    if (licht > 0.35 && r2 < 0.5) return ramp[2];
    if (r2 > 0.8 && licht < 0.3 && (onderrand || ny < 0.25)) return ramp[0];
    if (licht < -0.6 && (onderrand || ny < 0.25)) return ramp[0];
    return ramp[1];
  };
}

  for (const k of Object.keys(vers.totaal)) if (S.totaal[k] === undefined) S.totaal[k] = vers.totaal[k];
  for (const k of Object.keys(vers.jacht)) if (S.jacht[k] === undefined) S.jacht[k] = vers.jacht[k];
  for (const id of Object.keys(S.paarden)) {
    if (!RAS[rasVan(id)]) { delete S.paarden[id]; continue; }
    const leeg = nieuwPaard(id, nu);
    for (const k of Object.keys(leeg)) if (S.paarden[id][k] === undefined) S.paarden[id][k] = leeg[k];

}

const stal = (S) => STALLEN[S.stal.nr - 1];
const wei = (S) => WEIDEN[S.wei.nr];

const inStal = (S) => Object.keys(S.paarden).filter((id) => !S.paarden[id].pension);
const inWei = (S) => inStal(S).filter((id) => S.paarden[id].inWei);

const boxBewoners = (S) => inStal(S).filter((id) => !S.paarden[id].veulen);
const veulensVan = (S, id) => Object.keys(S.paarden).filter((k) => S.paarden[k].veulen && S.paarden[k].veulen.moeder === id);

const isWeg = (S, id) => !!((S.rit && S.rit.paard === id && !S.rit.klaar) || (S.wedstrijd && S.wedstrijd.paard === id && !S.wedstrijd.klaar));

function mods(S) {
  const m = { schoon: 1, hoeven: 1, plezier: 1, mest: 1, winter: 1, mak: 1, rit: 1 };
  for (const id of Object.keys(S.bezit)) if (ITEM[id] && ITEM[id].mod) for (const k of Object.keys(ITEM[id].mod)) m[k] *= ITEM[id].mod[k];
  const M = modus(S);
  m.comfort = stal(S).comfort; m.verval = M.verval; m.ziekModus = M.ziek;
  return m;
}

function stemming(S, p) {
  const g = (p.honger + p.dorst + p.plezier + p.energie + p.gezond + p.schoon) / 6;
  return p.ziek ? g * 0.7 : g;
}

function begrens(S) {
  const vl = modus(S).vloer, c = (v) => clamp(v, vl, 100);
  S.stal.water = c(S.stal.water); S.stal.hooi = clamp(S.stal.hooi, 0, 100); S.stal.mest = clamp(S.stal.mest, 0, 12);
  for (const id of Object.keys(S.paarden)) {
    const p = S.paarden[id];
    p.honger = c(p.honger); p.dorst = c(p.dorst); p.plezier = c(p.plezier); p.energie = c(p.energie); p.gezond = c(p.gezond); p.schoon = c(p.schoon);
    p.mak = clamp(p.mak, 0, 100); p.band = clamp(p.band, 0, 100); p.gewicht = clamp(p.gewicht, 0.8, 1.3);
    if (vl && p.ziek) p.ziek = null;
  }
}

function wordZiek(S, p, id, t, ziekte) {
  p.ziek = ziekte; p.ziekSinds = t;
  S.gebeurd && S.gebeurd.push({ t, soort: 'ziek', id, ziekte });
}

function simMinuut(S, t, m) {
  const nacht = isNacht(t), h = 1 / 60, c = m.comfort * m.verval, winter = seizoen(t) === 'winter';
  const buiten = inWei(S), binnen = inStal(S), r = S.rit;
  let wakker = 0;
  for (const id of binnen) {
    const p = S.paarden[id], ras = RAS[rasVan(id)], onderweg = isWeg(S, id);
    if (p.veulen) {

      const mo = S.paarden[p.veulen.moeder];
      if (mo) { p.inWei = mo.inWei && !isWeg(S, p.veulen.moeder); p.pension = !!mo.pension; p.honger = Math.max(p.honger, mo.honger - 5); p.dorst = Math.max(p.dorst, mo.dorst - 5); }
      if (t >= p.veulen.volwassen) groeiOp(S, id, t);
    }
    if (p.dracht && t >= p.dracht.tot) geboorte(S, id, t);

    if (nacht && !p.slaapt) { p.slaapt = true; S.gebeurd && S.gebeurd.push({ t, soort: 'inslaap', id }); }
    if (!nacht && p.slaapt) p.slaapt = false;
    const ziekF = p.ziek ? 1.4 : 1;
    if (p.slaapt) {
      p.honger -= 1.5 * h * c * ziekF; p.dorst -= 1.2 * h * c;
      p.energie += (p.inWei ? 8 : 11) * h;
    } else {
      wakker++;

      p.dorst -= (p.inWei && !winter ? 5 : 3.5) * h * c;

      const gezelschap = p.inWei ? buiten.length : binnen.length - buiten.length;
      p.plezier -= (p.inWei ? 0.8 : 3) * (gezelschap > 1 ? 0.7 : 1) * m.plezier * h * c * ziekF;
      p.energie -= (p.inWei ? 3 : 1.5) * h * c * (winter && p.inWei ? 2 * m.winter : 1);

      p.schoon -= (p.inWei ? 2.5 : 1 + S.stal.mest * 0.25) * m.schoon * h * c;
    }
    if (onderweg) { p.energie -= 6 * h; p.schoon -= 4 * h; }
    if (p.ziek) p.gezond -= 3 * h * m.verval;

    if (p.honger <= 0 || p.dorst <= 0) p.gezond -= 3 * h;
    p.gewicht += (1 - p.gewicht) * 0.02 * h - (p.honger < 15 ? 0.01 * h : 0);

    if (t - p.aandachtOp > 2 * DAG && p.mak > MAK.vloer) p.mak = Math.max(MAK.vloer, p.mak - MAK.verval * h * m.verval);

    if (!p.inWei && t >= p.mestPlan) { p.mestPlan = t + (2 + rnd(S) * 3) * UUR; S.stal.mest += 1; }

    if (!p.ziek && m.ziekModus > 0) {
      const hoevenOver = (t - p.hoevenOp) / DAG > HOEVEN_DAGEN * m.hoeven;
      const risico = [
        ['koliek', (p.dorst <= 5 ? 0.0012 : 0) + (p.snoep.n > 4 ? 0.0008 : 0)],
        ['kreupel', hoevenOver ? 0.0009 : 0],
        ['mok', (S.stal.mest >= 6 && !p.inWei ? 0.0008 : 0) + (p.schoon < 15 ? 0.0006 : 0)],
        ['verkoudheid', winter && p.inWei && !S.bezit.deken && nacht ? 0.0008 : 0],
        ['zadeldruk', onderweg && p.schoon < 30 ? 0.002 : 0],
      ];
      let som = 0;
      for (const q of risico) som += q[1];
      if (som > 0) {
        const f = m.ziekModus * (p.slaapt ? 0.5 : 1), u = rnd(S);
        if (u < som * f) { let acc = 0; for (const q of risico) { acc += q[1] * f; if (u < acc) { wordZiek(S, p, id, t, q[0]); break; } } }
      }
    }

    const behoeften = { honger: p.honger, dorst: p.dorst, plezier: p.plezier, schoon: p.schoon };
    for (const naam of Object.keys(behoeften)) {

    const st = stemming(S, p);

  if (S.inkomenRest >= 1) { const hele = Math.floor(S.inkomenRest); S.munten += hele; S.inkomenRest -= hele; S.totaal.verdiendPaarden += hele; }

  if (r && t >= r.einde && !r.klaar) eindRit(S, t);
  if (S.wedstrijd && t >= S.wedstrijd.einde && !S.wedstrijd.klaar) eindWedstrijd(S, t);
  begrens(S);
  S.laatsteTik = t;
}

function inhalen(S, nu) {
  const tot = minuutVan(nu);
  if (tot - S.laatsteTik > 14 * DAG) S.laatsteTik = tot - 14 * DAG;
  const voor = { munten: S.munten, t: S.laatsteTik };
  S.gebeurd = [];

function dagBonus(S, t) {
  const vandaag = dagSleutel(t), gisteren = dagSleutel(t - DAG);
  if (S.bonus.dag === vandaag) return null;
  S.bonus.reeks = S.bonus.dag === gisteren ? Math.min(7, S.bonus.reeks + 1) : 1;
  S.bonus.dag = vandaag;
  const munten = 20 + 15 * S.bonus.reeks;
  const snacks = ['wortel', 'appel', 'peer', 'suikerklontje'];
  const snack = snacks[Math.floor(rnd(S) * snacks.length)];
  S.munten += munten;
  S.voorraad[snack] = (S.voorraad[snack] || 0) + 1;
  return { reeks: S.bonus.reeks, munten, snack };
}


function makTeller(p, t) {
  const d = dagSleutel(t);
  if (p.mak_dag.dag !== d) p.mak_dag = { dag: d, aai: 0, borstel: 0, snack: 0 };
  return p.mak_dag;
}


function aandacht(S, p, id, t, soort) {
  const tel = makTeller(p, t), max = MAK[soort + 'Max'];

  if (max && tel[soort] >= max) return 0;
  if (max) tel[soort]++;
  const erbij = MAK[soort] * mods(S).mak * (1 - 0.6 * RAS[rasVan(id)].vurig);
  p.mak += erbij;
  return erbij;

function voeren(S, id, itemId, t) {
  const p = S.paarden[id], item = ITEM[itemId];

  if ((S.voorraad[itemId] || 0) <= 0) return { ok: false, reden: 'Op. Koop meer in de winkel.', winkel: item.cat };
  if (p.slaapt) return { ok: false, reden: p.naam + ' slaapt. Morgen weer.' };
  if (p.ziek === 'koliek' && item.cat === 'snack') return { ok: false, reden: 'Geen snoep met koliek. Eerst de dierenarts.' };
  const snack = item.cat === 'snack';
  if (!snack && p.honger >= 97) return { ok: false, reden: p.naam + ' zit vol.' };
  if (snack) {
    const d = dagSleutel(t);
    if (p.snoep.dag !== d) p.snoep = { dag: d, n: 0 };
    if (itemId === 'suikerklontje' && p.snoep.n >= 2) return { ok: false, reden: 'Genoeg suiker voor vandaag: dat geeft koliek.' };
    p.snoep.n++;

}

function waterGeven(S) {
  const had = S.stal.water;
  S.stal.water = 100;
  for (const id of inStal(S)) { const p = S.paarden[id]; if (!p.inWei) { p.dorst = Math.min(100, p.dorst + 50); p.aandachtOp = Math.max(p.aandachtOp, 0); } }
  begrens(S);
  return { ok: true, was: had };
}
function drinken(S, id) {
  const p = S.paarden[id];
  if (!p) return { ok: false };
  if (S.stal.water < 5 && !p.inWei) return { ok: false, reden: 'De emmer is leeg. Geef eerst water.' };
  p.dorst = 100; if (!p.inWei) S.stal.water -= 15;
  begrens(S);
  return { ok: true };
}

function aaien(S, id, t) {
  const p = S.paarden[id];
  if (!p) return { ok: false };
  if (p.slaapt) return { ok: false, reden: p.naam + ' slaapt.' };
  const tel = makTeller(p, t);
  tel.aaiAlle = (tel.aaiAlle || 0) + 1;
  if (tel.aaiAlle > MAK.aaiStop) return { ok: false, reden: p.naam + ' heeft genoeg geknuffeld voor vandaag.' };
  p.plezier += 3; p.band += 0.5;
  const mak = aandacht(S, p, id, t, 'aai');
  begrens(S);
  return { ok: true, mak };
}

function borstelen(S, id, t) {
  const p = S.paarden[id];
  if (!p) return { ok: false };
  if (p.slaapt) return { ok: false, reden: p.naam + ' slaapt.' };
  if (p.inWei) return { ok: false, reden: 'Haal ' + p.naam + ' eerst naar de stal.' };
  const was = p.schoon;
  p.schoon = Math.min(100, p.schoon + 45); p.plezier += 8; p.band += 1.5;
  const mak = aandacht(S, p, id, t, 'borstel');
  begrens(S);
  return { ok: true, was, mak };
}

function uitmesten(S) {
  const n = S.stal.mest;
  if (n <= 0) return { ok: false, reden: 'De stal is al schoon.' };
  S.stal.mest = 0; S.mesthoop += n;
  for (const id of inStal(S)) { const p = S.paarden[id]; if (!p.inWei) p.plezier += 4; }
  begrens(S);
  return { ok: true, n };
}

function verkoopMest(S) {
  if (S.mesthoop < 5) return { ok: false, reden: 'Nog niet genoeg mest voor de tuinder (minstens 5 kruiwagens).' };
  const munten = S.mesthoop * 5;
  S.munten += munten; S.mesthoop = 0;
  return { ok: true, munten };
}

const hoevenDagen = (S, p, t) => (t - p.hoevenOp) / DAG;
function hoefsmid(S, id, t) {
  const p = S.paarden[id], prijs = 60;
  if (!p) return { ok: false };
  if (S.munten < prijs) return { ok: false, reden: 'De hoefsmid kost ' + prijs + ' munten.' };
  S.munten -= prijs; p.hoevenOp = t;
  if (p.ziek === 'kreupel') { p.ziek = null; p.gezond = Math.max(p.gezond, 60); }
  return { ok: true, prijs };
}
function dierenarts(S, id) {
  const p = S.paarden[id], prijs = 250;
  if (!p) return { ok: false };
  if (!p.ziek) return { ok: false, reden: p.naam + ' is niet ziek.' };
  if (S.munten < prijs) return { ok: false, reden: 'De dierenarts kost ' + prijs + ' munten.' };
  S.munten -= prijs; p.ziek = null; p.gezond = 100;
  return { ok: true, prijs };
}


function naarWei(S, id, t) {
  const p = S.paarden[id];
  if (!p || p.pension) return { ok: false };
  if (p.inWei) return { ok: false };
  if (p.veulen) return { ok: false, reden: p.naam + ' blijft bij ' + (S.paarden[p.veulen.moeder] ? S.paarden[p.veulen.moeder].naam : 'zijn moeder') + '.' };
  if (inWei(S).filter((k) => !S.paarden[k].veulen).length >= wei(S).cap) return { ok: false, reden: 'De wei is vol (' + wei(S).cap + '). Koop een grotere wei of haal een paard naar binnen.' };
  if (isWeg(S, id)) return { ok: false, reden: p.naam + ' is ' + (S.rit && S.rit.paard === id ? 'onderweg' : 'op wedstrijd') + '.' };
  if (p.ziek === 'kreupel') return { ok: false, reden: p.naam + ' is kreupel: eerst de hoefsmid.' };
  p.inWei = true; p.plezier += 5; p.weiSinds = t;
  for (const v of veulensVan(S, id)) { S.paarden[v].inWei = true; S.paarden[v].plezier += 5; }
  return { ok: true };
}
function naarStal(S, id) {
  const p = S.paarden[id];
  if (!p || !p.inWei) return { ok: false };
  if (p.veulen) return { ok: false, reden: p.naam + ' blijft bij zijn moeder.' };
  p.inWei = false;
  for (const v of veulensVan(S, id)) S.paarden[v].inWei = false;
  return { ok: true };
}
function zetFavoriet(S, id) {

  for (const k of Object.keys(S.paarden)) S.paarden[k].favoriet = k === id;
  return { ok: true };
}





function startRit(S, id, routeId, t) {
  const p = S.paarden[id], route = ROUTE[routeId];
  if (!p || !route) return { ok: false };
  if (S.rit && !S.rit.klaar) return { ok: false, reden: 'Er is al een rit bezig.' };
  if (!S.bezit.zadel) return { ok: false, reden: 'Je hebt nog geen zadel.', winkel: 'rijden' };
  if (p.pension) return { ok: false, reden: p.naam + ' staat in het pension.' };
  if (p.veulen) return { ok: false, reden: p.naam + ' is nog een veulen: te jong om op te rijden.' };
  if (isWeg(S, id)) return { ok: false, reden: p.naam + ' is op wedstrijd.' };
  if (p.dracht && route.duur >= 20) return { ok: false, reden: p.naam + ' is drachtig: alleen de korte ritjes.' };
  if (p.slaapt || isNacht(t)) return { ok: false, reden: 'Het is nacht. Morgen weer.' };
  if (p.ziek) return { ok: false, reden: p.naam + ' is ziek (' + ZIEKTES[p.ziek].naam.toLowerCase() + '). Eerst beter worden.' };
  if (p.mak < route.mak) return { ok: false, reden: p.naam + ' is nog niet mak genoeg voor deze route (nodig: ' + route.mak + ', nu ' + Math.floor(p.mak) + ').' };
  if (p.energie < 25) return { ok: false, reden: p.naam + ' is te moe.' };
  if (p.honger < 15 || p.dorst < 15) return { ok: false, reden: 'Eerst eten en drinken.' };
  const duur = route.duur * MIN, poep = [];

  for (let tijd = 30000 + rnd(S) * 150000; tijd < duur - 10000; tijd += 90000 + rnd(S) * 150000) poep.push({ t: t + Math.round(tijd), status: 'komt' });
  S.rit = { paard: id, route: routeId, start: t, einde: t + duur, poep, klaar: false, vondst: null };
  if (p.inWei) p.inWei = false;
  for (const v of veulensVan(S, id)) S.paarden[v].inWei = false;
  return { ok: true, rit: S.rit };
}

function ritBijwerken(S, t) {
  const r = S.rit;
  if (!r) return null;
  for (const q of r.poep) {
    if (q.status === 'komt' && t >= q.t) q.status = S.bezit.poepzak ? 'gevangen' : 'ligt';
    if (q.status === 'gevangen' && !q.geteld) { q.geteld = true; S.pluspunten += 1; }
  }
  return r;
}
function ruimOp(S, t) {
  const r = ritBijwerken(S, t);
  if (!r) return { ok: false };
  const q = r.poep.find((x) => x.status === 'ligt');
  if (!q) return { ok: false, reden: 'Het pad is schoon.' };
  q.status = 'opgeruimd'; S.pluspunten += 2; S.munten += 15; S.totaal.opgeruimd++;
  return { ok: true };
}
function eindRit(S, t) {
  const r = ritBijwerken(S, t), m = mods(S);
  if (!r || r.klaar) return null;
  const p = S.paarden[r.paard], route = ROUTE[r.route];
  r.klaar = true;
  let boete = 0, gemist = 0;
  for (const q of r.poep) if (q.status === 'ligt' || q.status === 'komt') { q.status = 'gemist'; gemist++; }
  if (gemist && route.fietspad) { boete = gemist * 10; S.munten = Math.max(0, S.munten - boete); S.totaal.boetes += gemist; }
  const munten = Math.round(route.munten * m.rit);
  S.munten += munten; S.totaal.verdiendRitten += munten; S.totaal.ritten++;
  if (p) {
    p.ritten++; p.plezier += 25; p.band += 4; p.energie -= 10; p.schoon -= 15;
    p.mak += MAK.rit * m.mak; p.aandachtOp = t;
  }

  if (rnd(S) < 0.6) {
    const v = route.vondst[Math.floor(rnd(S) * route.vondst.length)];
    r.vondst = v; S.verzameld[v] = (S.verzameld[v] || 0) + 1;
    if (v === 'appel') S.voorraad.appel = (S.voorraad.appel || 0) + 1;
  }
  r.beloning = { munten, boete, gemist, gevangen: r.poep.filter((q) => q.status === 'gevangen').length, opgeruimd: r.poep.filter((q) => q.status === 'opgeruimd').length };
  S.gebeurd && S.gebeurd.push({ t, soort: 'rit_klaar', id: r.paard, beloning: r.beloning, vondst: r.vondst });
  begrens(S);
  return r.beloning;
}
function ritVoortgang(S, t) {
  const r = S.rit;
  if (!r) return 0;
  return clamp((t - r.start) / (r.einde - r.start), 0, 1);
}




function dek(S, id, hengstRas, t) {
  const p = S.paarden[id], r = RAS[hengstRas];

      '<dt>Beloning</dt><dd>ronde 1: ' + eindelozeBeloning(1) + ', ronde 5: ' + eindelozeBeloning(5) + ', ronde 10: ' + eindelozeBeloning(10) + ' munten</dd></dl>';
    html += '<button class="hoofdknop" data-eindeloos="1">Beginnen</button>';
  } else {
    const lv = Math.floor(S.jacht.lolVangst / LOL_PER_LEVEL);
    html += '<div class="weetje"><b>Gewoon lekker spelen.</b><br>Geen doel, geen zetten, geen haast. Elke 100 spullen is een level erbij, en per 10 levels krijg je 1 munt.</div>';
    html += '<dl class="feiten"><dt>Level</dt><dd>' + lv + '</dd><dt>Verzameld</dt><dd>' + getal(S.jacht.lolVangst) + ' spullen</dd><dt>Volgende munt</dt><dd>bij level ' + (Math.floor(lv / LOL_LEVELS_PER_MUNT) + 1) * LOL_LEVELS_PER_MUNT + '</dd></dl>';
    html += '<button class="hoofdknop" data-lol="1">Spelen</button>';

}

function startJacht(opts) {
  const soort = opts.soort || 'level';
  let n, zetten, doel;
  if (soort === 'level') { const lv = jachtLevel(opts.L); n = lv.soorten; zetten = Infinity; doel = lv.doel; }
  else if (soort === 'eindeloos') { const r = eindelozeRonde(1); n = r.soorten; zetten = r.zetten; doel = r.doel; }
  else { n = LOL_SOORTEN; zetten = Infinity; doel = LOL_PER_LEVEL; }
  Object.assign(Jacht, { actief: true, soort, L: opts.L || 0, n, rng: maakRng(Date.now() & 0x7fffffff), zetten, gedaan: 0, punten: 0, combo: 1,
    ronde: 1, rondePunten: 0, rondeDoel: doel, verdiend: 0, vangstSessie: 0,
    gevangen: new Array(JACHT.length).fill(0), fase: 'idle', ronde_: null, weg: null, sel: null, vp: {}, popups: [], hint: null, laatsteActie: performance.now() });
  Jacht.bord = jachtNieuwBord(Jacht.n, Jacht.rng);
  const titel = soort === 'level' ? 'Level ' + opts.L : soort === 'eindeloos' ? 'Ronde 1' : 'Voor de lol';
  const onder = soort === 'level' ? (Jacht.modus === 'munten' ? 'Drie sterren in ' + jachtLevel(opts.L).zetten + ' zetten: ' + getal(jachtBeloning(opts.L)) + ' munten' : 'Je vangst gaat mee naar de stal')
    : soort === 'eindeloos' ? 'Haal het doel in 20 zetten' : 'Tik op Terug om te stoppen';
  const el = $('tab-jacht');
  el.innerHTML = '<div class="hud"><button class="rond" id="jachtStop" aria-label="Stoppen"><svg viewBox="0 0 24 24"><path d="M15.4 5 8.4 12l7 7 1.4-1.4L11.2 12l5.6-5.6z"/></svg></button>' +
    '<div class="doel"><span><b id="jachtTitel">' + titel + '</b><em id="jachtPunten" style="font-style:normal"></em></span><div class="balk"><i id="jachtBalk" style="width:0%"></i></div></div>' +
    '<div class="zetten"><span id="jachtZetten"></span><small id="jachtZetLabel">ZETTEN</small></div></div>' +
    '<canvas id="bord" width="256" height="256"></canvas>' +
    '<p id="jachtOnder" style="margin:0;font-size:12.5px;color:var(--inkt2);text-align:center">' + onder + '</p>';
  Jacht.cv = $('bord');
  Jacht.ctx = Jacht.cv.getContext('2d');
  Jacht.buf = new Buf(256, 256);
  for (let i = 0; i < Jacht.bord.length; i++) Jacht.vp[Jacht.bord[i].id] = { x: (i % BN) * CEL, y: ((i / BN) | 0) * CEL - 256 - Math.random() * 60 };
  Jacht.fase = 'val';
  jachtHud();
  $('jachtStop').onclick = () => {
    if (Jacht.soort === 'level' || Jacht.fase !== 'idle') { Jacht.stop(); renderJacht(); return; }
    jachtKlaar(false, true);
  };
  const cel = (e) => { const r = Jacht.cv.getBoundingClientRect(); const x = Math.floor(((e.clientX - r.left) / r.width) * BN), y = Math.floor(((e.clientY - r.top) / r.height) * BN); return x >= 0 && y >= 0 && x < BN && y < BN ? y * BN + x : -1; };
  Jacht.cv.addEventListener('pointerdown', (e) => { audioStart(); Jacht.druk = { i: cel(e), x: e.clientX, y: e.clientY, bewogen: false }; try { Jacht.cv.setPointerCapture(e.pointerId); } catch (x) {  } });
  Jacht.cv.addEventListener('pointermove', (e) => {
    const d = Jacht.druk;
    if (!d || d.bewogen || d.i < 0) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y, r = Jacht.cv.getBoundingClientRect(), drempel = r.width / BN / 2.5;
    if (Math.abs(dx) < drempel && Math.abs(dy) < drempel) return;
    d.bewogen = true;
    const x = d.i % BN, y = (d.i / BN) | 0;
    let j = -1;
    if (Math.abs(dx) > Math.abs(dy)) j = dx > 0 && x < BN - 1 ? d.i + 1 : dx < 0 && x > 0 ? d.i - 1 : -1;
    else j = dy > 0 && y < BN - 1 ? d.i + BN : dy < 0 && y > 0 ? d.i - BN : -1;
    if (j >= 0) { Jacht.sel = null; jachtSchuif(d.i, j); }
  });
  Jacht.cv.addEventListener('pointerup', () => {
    const d = Jacht.druk; Jacht.druk = null;
    if (!d || d.bewogen || d.i < 0) return;
    if (Jacht.sel != null && jachtNaast(Jacht.sel, d.i)) { const a = Jacht.sel; Jacht.sel = null; jachtSchuif(a, d.i); }
    else { Jacht.sel = Jacht.sel === d.i ? null : d.i; geluid('klik'); }
  });
}

function jachtSchuif(a, c) {
  if (Jacht.fase !== 'idle' || Jacht.zetten <= 0) return;
  Jacht.laatsteActie = performance.now(); Jacht.hint = null;
  const ronde = jachtZet(Jacht.bord, a, c);
  if (!ronde) {

    const A = Jacht.bord[a], C = Jacht.bord[c];
    Jacht.vp[A.id] = { x: (c % BN) * CEL, y: ((c / BN) | 0) * CEL };
    Jacht.vp[C.id] = { x: (a % BN) * CEL, y: ((a / BN) | 0) * CEL };
    Jacht.fase = 'terug'; Jacht.faseT = performance.now();
    geluid('fout'); tril(30);
    return;
  }
  Jacht.zetten--; Jacht.gedaan++; Jacht.combo = 1; Jacht.ronde_ = ronde;
  Jacht.fase = 'wissel'; Jacht.faseT = performance.now();
  geluid('wissel');
  jachtHud();
}

function jachtStap(nu) {
  const J = Jacht;
  if (!J.actief) return;
  const t = nu - J.faseT;

  let beweegt = false;
  for (let i = 0; i < J.bord.length; i++) {
    const c = J.bord[i];
    if (!c) continue;
    const v = J.vp[c.id] || (J.vp[c.id] = { x: (i % BN) * CEL, y: -CEL });
    const tx = (i % BN) * CEL, ty = ((i / BN) | 0) * CEL;
    if (J.fase === 'terug' && t < 140) continue;
    const snel = J.fase === 'val' ? 16 : 6;
    if (Math.abs(v.x - tx) > 0.5) { v.x += clamp(tx - v.x, -snel, snel); beweegt = true; } else v.x = tx;
    if (Math.abs(v.y - ty) > 0.5) { v.y += clamp(ty - v.y, -snel, snel); beweegt = true; } else v.y = ty;
  }
  if (J.fase === 'terug' && t > 140 && !beweegt) J.fase = 'idle';
  if (J.fase === 'wissel' && !beweegt && t > 90) { J.fase = 'weg'; J.faseT = nu; J.weg = new Set(J.ronde_.weg); geluid('pop', J.combo); jachtGeluid(J.ronde_); if (J.ronde_.ontploft.length) { geluid('boem'); tril(40); } }
  if (J.fase === 'weg' && t > 230) {
    const r = jachtToepassen(J.bord, J.ronde_, J.combo, J.n, J.rng);
    J.punten += r.punten; J.rondePunten += r.punten;
    let gevangen = 0;
    r.gevangen.forEach((v, i) => { J.gevangen[i] += v; gevangen += v; });
    const midden = J.ronde_.weg.reduce((a, i) => [a[0] + (i % BN), a[1] + ((i / BN) | 0)], [0, 0]).map((v) => (v / J.ronde_.weg.length) * CEL + CEL / 2);
    J.popups.push({ x: midden[0], y: midden[1], tekst: '+' + r.punten, t0: nu, combo: J.combo });
    for (const m of r.val) if (m.nieuw) J.vp[m.id] = { x: 0, y: m.van * CEL };
    for (const m of r.val) if (m.nieuw) { const i = J.bord.findIndex((c) => c && c.id === m.id); J.vp[m.id].x = (i % BN) * CEL; }
    if (J.soort === 'lol') lolVangst(gevangen, nu);
    J.weg = null; J.fase = 'val'; J.faseT = nu;
    jachtHud();
  }
  if (J.fase === 'val' && !beweegt && t > 60) {
    const volgende = jachtRonde(J.bord, null);
    if (volgende) { J.combo++; J.ronde_ = volgende; J.fase = 'weg'; J.faseT = nu; J.weg = new Set(volgende.weg); geluid('pop', J.combo); jachtGeluid(volgende); if (volgende.ontploft.length) geluid('boem'); return; }
    if (!jachtHeeftZet(J.bord)) { jachtSchud(J.bord, J.n, J.rng); melding('Geen zetten meer: geschud!'); }
    J.fase = 'idle';
    if (J.soort === 'level') {
      if (J.punten >= jachtLevel(J.L).doel) jachtKlaar(true);
    } else if (J.soort === 'eindeloos') {
      if (J.rondePunten >= J.rondeDoel) rondeGehaald(nu);
      else if (J.zetten <= 0) jachtKlaar(false);
    }
  }
  if (J.fase === 'idle' && nu - J.laatsteActie > 6000 && !J.hint) J.hint = jachtHint(J.bord);
}

function jachtGeluid(ronde) {
  const tel = {};
  for (const i of ronde.weg) { const c = Jacht.bord[i]; if (c && c.t >= 0) tel[c.t] = (tel[c.t] || 0) + 1; }
  const t = Object.keys(tel).sort((a, b) => tel[b] - tel[a])[0];
  if (t != null) geluid('tegel', JACHT[t].id);
  if (ronde.ontploft.some((o) => o.s === 4)) geluid('hinnik', RAS[rasVan(S.gekozen)]);
}

function rondeGehaald(nu) {
  const J = Jacht, mee = Math.min(EIND_MEE_MAX, J.zetten), loon = eindelozeBeloning(J.ronde) + EIND_PER_ZET * (J.zetten - mee);
  S.munten += loon; S.totaal.verdiendSpel += loon; J.verdiend += loon;
  S.jacht.besteRonde = Math.max(S.jacht.besteRonde || 0, J.ronde);
  J.popups.push({ x: 128, y: 118, tekst: 'Ronde ' + J.ronde + ' gehaald!', t0: nu, groot: true });
  J.popups.push({ x: 128, y: 146, tekst: '+' + loon + ' munten', t0: nu, groot: true });
  geluid('gewonnen'); tril(40);
  J.ronde++;
  const vorigeN = J.n, r = eindelozeRonde(J.ronde);
  J.n = r.soorten; J.zetten = r.zetten + mee; J.rondeDoel = r.doel; J.rondePunten = 0;
  if (mee) J.popups.push({ x: 128, y: 174, tekst: '+' + mee + ' zetten mee', t0: nu, groot: true });
  if (J.n > vorigeN) melding('Nieuw erbij: ' + JACHT[J.n - 1].naam.toLowerCase() + '!', 'iconen/' + JACHT[J.n - 1].id);
  $('jachtTitel').textContent = 'Ronde ' + J.ronde;
  veranderd();
  jachtHud();
}

function lolVangst(aantal, nu) {
  const was = Math.floor(S.jacht.lolVangst / LOL_PER_LEVEL);
  S.jacht.lolVangst += aantal; Jacht.vangstSessie += aantal;
  const nu_ = Math.floor(S.jacht.lolVangst / LOL_PER_LEVEL);
  if (nu_ > was) {
    Jacht.popups.push({ x: 128, y: 128, tekst: 'Level ' + nu_ + '!', t0: nu, groot: true });
    geluid('beter');
    const tegoed = Math.floor(nu_ / LOL_LEVELS_PER_MUNT) - S.jacht.lolMunt;
    if (tegoed > 0) { S.jacht.lolMunt += tegoed; S.munten += tegoed; melding('Level ' + nu_ + ': ' + tegoed + ' munt verdiend!', 'iconen/munt'); }
  }
  veranderd();
}

function jachtHint(b) {
  for (let i = 0; i < b.length; i++) {
    const x = i % BN;
    for (const j of [x < BN - 1 ? i + 1 : -1, i + BN < b.length ? i + BN : -1]) {
      if (j < 0) continue;
      if (b[i].s === 4 || b[j].s === 4) return [i, j];
      jachtWissel(b, i, j);
      const ok = jachtRuns(b).length > 0;
      jachtWissel(b, i, j);
      if (ok) return [i, j];
    }
  }
  return null;
}

function jachtHud() {
  const J = Jacht, p = $('jachtPunten'), z = $('jachtZetten'), b = $('jachtBalk');
  let tel, fractie;
  if (J.soort === 'level') { const doel = jachtLevel(J.L).doel; tel = getal(J.punten) + ' / ' + getal(doel); fractie = J.punten / doel; }
  else if (J.soort === 'eindeloos') { tel = getal(J.rondePunten) + ' / ' + getal(J.rondeDoel); fractie = J.rondePunten / J.rondeDoel; }
  else { const rest = S.jacht.lolVangst % LOL_PER_LEVEL; tel = 'level ' + Math.floor(S.jacht.lolVangst / LOL_PER_LEVEL) + ' · ' + rest + ' / ' + LOL_PER_LEVEL; fractie = rest / LOL_PER_LEVEL; }
  if (p) p.textContent = tel;
  const label = $('jachtZetLabel');
  if (J.soort === 'level') {

    const par = jachtLevel(J.L).zetten, d2 = Math.ceil(par * 1.5);
    const [getalTekst, labelTekst] = J.gedaan < par ? [par - J.gedaan, 'VOOR ★★★'] : J.gedaan < d2 ? [d2 - J.gedaan, 'VOOR ★★'] : ['∞', '★'];
    if (z) z.textContent = getalTekst;
    if (label) label.textContent = labelTekst;
  } else if (z) z.textContent = Number.isFinite(J.zetten) ? J.zetten : '∞';
  if (b) { b.style.width = Math.min(100, fractie * 100) + '%'; b.className = fractie >= 1 ? '' : 'let'; }
}

function tekenJacht(nu) {
  const J = Jacht;
  if (!J.actief || !J.cv) return;
  const buf = J.buf;
  for (let y = 0; y < BN; y++) for (let x = 0; x < BN; x++) buf.rh(x * CEL, y * CEL, CEL, CEL, (x + y) % 2 ? [44, 32, 24] : [54, 40, 29]);
  if (J.hint && Math.floor(nu / 400) % 2) for (const i of J.hint) buf.rh((i % BN) * CEL, ((i / BN) | 0) * CEL, CEL, CEL, [110, 80, 50], 0.8);
  if (J.sel != null) buf.rh((J.sel % BN) * CEL, ((J.sel / BN) | 0) * CEL, CEL, CEL, [255, 210, 77], 0.35);
  const bom = 'hoofden/' + rasVan(S.gekozen), bomSpr = SPR[bom];
  for (let i = 0; i < J.bord.length; i++) {
    const c = J.bord[i];
    if (!c) continue;
    const v = J.vp[c.id] || { x: (i % BN) * CEL, y: ((i / BN) | 0) * CEL };
    let f = 1;
    if (J.weg && J.weg.has(i)) f = Math.max(0.1, 1 - (nu - J.faseT) / 230);
    const cx = v.x + CEL / 2, cy = v.y + CEL / 2;
    if (c.s === 3) buf.cirkel(cx, cy, 14 + Math.sin(nu / 150) * 1.5, [255, 230, 120], 0.35);
    if (c.s === 4) {

      buf.cirkel(cx, cy, 14 + Math.sin(nu / 120) * 1.5, [255, 210, 77], 0.5);
      if (bomSpr) tekenSprite(buf, bom, cx, cy, { schaal: f * (26 / bomSpr.buf.h), midden: true });
    } else {
      const spr = SPR['iconen/' + JACHT[c.t].id], past = spr ? 26 / Math.max(spr.buf.w, spr.buf.h) : 1;
      tekenSprite(buf, 'iconen/' + JACHT[c.t].id, cx, cy, { schaal: f * past, midden: true });
    }
    if (c.s === 1 || c.s === 2) {
      for (let k = -12; k <= 12; k += 6) {
        if (c.s === 1) buf.lijn(cx - 13, cy + k / 2, cx + 13, cy + k / 2, [255, 255, 255], 0.35);
        else buf.lijn(cx + k / 2, cy - 13, cx + k / 2, cy + 13, [255, 255, 255], 0.35);
      }
    }
  }
  J.ctx.putImageData(new ImageData(buf.d, 256, 256), 0, 0);
  J.popups = J.popups.filter((p) => nu - p.t0 < (p.groot ? 1800 : 900));
  J.ctx.textAlign = 'center';
  for (const p of J.popups) {
    const duur = p.groot ? 1800 : 900, a = 1 - (nu - p.t0) / duur;
    J.ctx.font = 'bold ' + (p.groot ? 22 : 13 + p.combo * 2) + 'px sans-serif';
    J.ctx.fillStyle = 'rgba(255,210,77,' + Math.min(1, a * 1.5) + ')';
    J.ctx.strokeStyle = 'rgba(28,21,17,' + Math.min(1, a * 1.5) + ')';
    J.ctx.lineWidth = p.groot ? 5 : 3;
    const y = p.y - (p.groot ? 0 : (1 - a) * 20);
    J.ctx.strokeText(p.tekst, p.x, y);
    J.ctx.fillText(p.tekst, p.x, y);
  }
}


function jachtKlaar(gewonnen, gestopt) {
  const J = Jacht, L = J.L;
  J.fase = 'klaar';
  S.jacht.gespeeld++;
  const regels = [];
  let titel, kop;
  if (J.soort === 'level') {
    S.jacht.beste[L] = Math.max(S.jacht.beste[L] || 0, J.punten);
    const par = jachtLevel(L).zetten, ster = jachtSterren(L, J.gedaan);
    S.jacht.gewonnen++; S.jacht.gehaald[L] = true;
    if (!S.jacht.sterren) S.jacht.sterren = {};
    S.jacht.sterren[L] = Math.max(S.jacht.sterren[L] || 0, ster);
    titel = '★'.repeat(ster) + '☆'.repeat(3 - ster) + ' Gehaald!';
    kop = 'Level ' + L + ' in ' + J.gedaan + ' zetten.' + (ster < 3 ? ' Drie sterren haal je in ' + par + ' zetten.' : '');
    if (J.modus === 'munten') {
      const loon = jachtLoon(L, J.gedaan);
      S.munten += loon; S.totaal.verdiendSpel += loon;
      regels.push(beloningRegel('iconen/munt', getal(loon) + ' munten', ster === 3 ? (par - J.gedaan ? 'Inclusief bonus voor ' + (par - J.gedaan) + ' zetten over' : 'Precies op tijd!') : ster === 2 ? 'Twee sterren: 40% van de beloning' : 'Eén ster: 20% van de beloning'));
    } else {
      const keer = ster === 3 ? 2 : ster === 2 ? 1.5 : 1;
      let munten = 0;
      J.gevangen.forEach((aantal, t) => {
        const tegel = JACHT[t];
        if (!aantal) return;
        if (tegel.voer) {
          const stuks = Math.floor((aantal / tegel.per) * keer);
          if (stuks > 0) {
            S.voorraad[tegel.voer] = (S.voorraad[tegel.voer] || 0) + stuks;
            regels.push(beloningRegel('iconen/' + tegel.voer, stuks + '× ' + ITEM[tegel.voer].naam.toLowerCase(), aantal + ' ' + tegel.naam.toLowerCase() + (aantal === 1 ? '' : 's') + ' gevangen'));
          }
        } else munten += Math.round(aantal * keer);
      });
      if (munten) { S.munten += munten; S.totaal.verdiendSpel += munten; regels.push(beloningRegel('iconen/hoefijzer', munten + ' munten', 'Hoefijzers, borstels en rozetten leveren munten op')); }
      if (!regels.length) regels.push('<p>Te weinig gevangen voor een portie voer.</p>');
    }
  } else if (J.soort === 'eindeloos') {
    const gehaald = J.ronde - 1;
    titel = gehaald ? 'Ronde ' + gehaald + ' gehaald!' : 'Volgende keer beter!';
    kop = (gestopt ? 'Je stopte in ronde ' : 'Het doel van ronde ') + J.ronde + (gestopt ? '.' : ' was net te hoog.') + ' Je record: ronde ' + (S.jacht.besteRonde || 0) + '.';
    regels.push(beloningRegel('iconen/munt', getal(J.verdiend) + ' munten', 'Verdiend in dit potje'));
  } else {
    titel = 'Lekker gespeeld!';
    kop = 'Je verzamelde ' + getal(J.vangstSessie) + ' spullen. Je bent nu level ' + Math.floor(S.jacht.lolVangst / LOL_PER_LEVEL) + '.';
  }
  veranderd();
  geluid(gewonnen || (J.soort === 'eindeloos' && J.ronde > 1) || J.soort === 'lol' ? 'gewonnen' : 'verloren');
  const opnieuw = J.soort === 'level' ? 'data-jachtopnieuw="' + L + '"' : J.soort === 'eindeloos' ? 'data-eindeloos="1"' : 'data-lol="1"';
  const html = '<p style="margin:0 0 10px;color:var(--inkt2)">' + esc(kop) + '</p>' + (regels.length ? '<div class="lijst">' + regels.join('') + '</div>' : '') +
    '<div class="rij" style="margin-top:12px"><button class="knop2" ' + opnieuw + '>Nog een keer</button>' + (J.soort === 'level' && gewonnen && L < JACHT_LEVELS.length ? '<button class="knop2" data-jachtopnieuw="' + (L + 1) + '">Level ' + (L + 1) + '</button>' : '') + '<button class="knop2" data-jachtlevels="1">Hoefijzerjacht</button></div>' +
    '<button class="hoofdknop" data-tab="stal">Naar de stal</button>';
  J.actief = false;
  setTimeout(() => openVel(titel, html), gestopt ? 0 : 450);

  renderAlles(); renderTab();
  if (!demo && !S.welkom) welkomVel();
  else if (!demo) { if (r.minuten > 60) welkomTerug(r); toonDagBonus(); }
  bewaarNu();

  let laatsteSim = 0, laatsteUi = 0, laatsteScene = 0;
  const lus = (t) => {
    requestAnimationFrame(lus);
    const klok = Date.now();
    if (klok - laatsteSim > 1000) {
      laatsteSim = klok;
      const rr = inhalen(S, klok);
      if (rr.minuten) {
        UI.vuil = true;
        for (const g of rr.gebeurd) {
          if (g.soort === 'ziek' && S.paarden[g.id]) melding(S.paarden[g.id].naam + ' voelt zich niet lekker: ' + ZIEKTES[g.ziekte].naam.toLowerCase() + '.', 'iconen/dierenarts');
          if (g.soort === 'rit_klaar') { geluid('vondst'); if (UI.tab === 'rit') renderRit(); else melding('Terug van de rit! Kijk bij Rijden.', 'iconen/ruiter'); }
          if (g.soort === 'wedstrijd_klaar') { geluid(g.uitslag && g.uitslag.plaats <= 3 ? 'rozet' : 'verloren'); if (UI.tab === 'rit') renderRit(); else melding('De uitslag is er! Kijk bij Rijden.', 'iconen/rozet'); }
          if (g.soort === 'geboorte' && S.paarden[g.id]) { geluid('geboorte', RAS[rasVan(g.id)]); melding('Er is een veulen geboren: ' + S.paarden[g.id].naam + '!', 'hoofden/' + rasVan(g.id)); Stal.koppen = {}; }
          if (g.soort === 'volwassen' && S.paarden[g.id]) { melding(S.paarden[g.id].naam + ' is volwassen geworden' + (S.paarden[g.id].pension ? ' en wacht in het pension op een box.' : '!'), 'hoofden/' + rasVan(g.id)); Stal.buf = null; }
        }
      }
      if (S.wedstrijd && !S.wedstrijd.klaar && UI.tab === 'rit') { const el = $('wedTijd'), b = $('wedBalk'); if (el) el.textContent = wedstrijdTekst(S, klok); if (b) b.style.width = (wedstrijdVoortgang(S, klok) * 100).toFixed(0) + '%'; }
      if (S.rit && !S.rit.klaar) { const voor = S.rit.poep.filter((q) => q.status === 'ligt').length; ritBijwerken(S, klok); const na = S.rit.poep.filter((q) => q.status === 'ligt').length; if (na > voor) { geluid('fietser'); if (UI.tab === 'rit') renderRit(); } else if (UI.tab === 'rit' && $('ritTijd')) $('ritTijd').textContent = ritTekst(S, klok); }
    }
    if (UI.vuil && t - laatsteUi > 250) { laatsteUi = t; renderAlles(); }
    if (document.hidden) return;
    if (t - laatsteScene > 33) {
      laatsteScene = t;
      if (UI.tab === 'stal') { if (UI.scene === 'stal') tekenStal(S, t, klok); else tekenWei(S, t, klok); klokje(); }
      else if (UI.tab === 'rit' && S.rit) tekenRitBalk(S, t, klok);
      else if (UI.tab === 'jacht' && Jacht.actief) { jachtStap(t); tekenJacht(t); }
      if (Borstel.actief) tekenBorstel(t);
    }
  };
  requestAnimationFrame(lus);
  document.addEventListener('visibilitychange', () => { if (document.hidden) window.appPauze(); else window.appHervat(); });
  window.addEventListener('pagehide', () => window.appPauze());
}

function zetDemo(soort) {
  const nu = Date.now();
  S = nieuweStaat(nu); S.welkom = true; S.modus = 'normaal'; S.bonus.dag = dagSleutel(nu);
  const m = /^(\w+?)(\d+)?$/.exec(soort) || [], wat = m[1] || soort, nr = Number(m[2] || 0);
  if (wat === 'wei' || wat === 'stal' || wat === 'rijk') {
    S.munten = 1e9;
    for (let n = 2; n <= STALLEN.length; n++) koopStal(S, n);
    for (let n = 1; n <= WEIDEN.length - 1; n++) koopWei(S, n);
    kiesStal(S, nr && wat === 'stal' ? nr : 5); kiesWei(S, nr && wat === 'wei' ? nr : 3);
    for (const r of ['fjord', 'tinker', 'fries', 'shetlander', 'appaloosa']) koopPaard(S, r, nu);
    for (const id of Object.keys(S.paarden)) { S.paarden[id].mak = 70; S.paarden[id].plezier = 90; S.paarden[id].energie = 90; }
    for (const b of ['appelboom', 'perenboom', 'kersenboom']) koop(S, b);
    if (wat === 'wei') { for (const id of inStal(S)) naarWei(S, id, nu); UI.scene = 'wei'; }
    S.munten = 1250000;
    isNacht = () => false;
  }
  if (wat === 'rit') {
    S.munten = 5000; S.bezit.zadel = true; if (nr !== 1) S.bezit.poepzak = true; S.paarden.haflinger.mak = 80;
    isNacht = () => false;
    startRit(S, 'haflinger', 'strand', nu - 4 * MIN);
    UI.tab = 'rit';
  }
  if (wat === 'veulen') {

    S.munten = 1e9; koopStal(S, 4); koopWei(S, 2); koopPaard(S, 'fjord', nu - 9 * DAG, 'v'); koopPaard(S, 'tinker', nu - 8 * DAG, 'm');
    for (const id of Object.keys(S.paarden)) { S.paarden[id].mak = 75; S.paarden[id].plezier = 90; }
    S.paarden.fjord.dracht = { sinds: nu - 3 * DAG, tot: nu - MIN, hengst: 'tinker' }; S.paarden.haflinger.dracht = { sinds: nu - DAG, tot: nu + 2 * DAG, hengst: 'haflinger' };
    S.gebeurd = []; geboorte(S, 'fjord', nu - MIN); delete S.gebeurd;
    S.munten = 48000; S.gekozen = 'fjord'; isNacht = () => false;
    if (nr === 1) { naarWei(S, 'fjord', nu); naarWei(S, 'tinker', nu); UI.scene = 'wei'; }
  }
  if (wat === 'wedstrijd') {
    S.munten = 5000; S.bezit.zadel = true; S.paarden.haflinger.mak = 85; S.paarden.haflinger.schoon = 95; S.paarden.haflinger.band = 60; isNacht = () => false;
    startWedstrijd(S, 'haflinger', 'dressuur', nu - 9.5 * MIN); if (nr === 1) { S.gebeurd = []; eindWedstrijd(S, nu); delete S.gebeurd; }
    UI.tab = 'rit';
  }
  if (wat === 'jacht') { UI.tab = 'jacht'; setTimeout(() => { startJacht({ soort: 'level', L: nr || 5 }); for (let i = 0; i < 400; i++) jachtStap(performance.now() + i * 30); }, 50); }
  if (wat === 'spring') { UI.tab = 'rit'; isNacht = () => false; setTimeout(() => { const k = document.querySelector('[data-spring]'); if (k) k.click(); }, 300); }
  if (wat === 'borstel') { S.paarden.haflinger.schoon = 30; isNacht = () => false; setTimeout(() => borstelVel('haflinger'), 300); }
  if (wat === 'nacht') isNacht = () => true;
  bewaarNu = () => {};
}

start();

</script>
