<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Marble Run</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #548fd9;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<script>
(function(){
  // Trackslinger/Marble Run: de telefoonsensoren voor Godot op het web (Godot zelf leest ze niet). x = schermrechts,
  // y = schermboven, z = door het scherm, in m/s^2 zoals de versnellingsmeter op Android (vlak liggend z = +9.8).
  window.__kantel = { x: 0, y: 0, z: 0, ok: false };
  function draai(x, y) {
    var a = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    if (a === 90) return [-y, x]; if (a === 180) return [-x, -y]; if (a === 270 || a === -90) return [y, -x];
    return [x, y];
  }
  function lees(e) {
    var g = e.accelerationIncludingGravity; if (!g || g.x === null) return;
    var p = draai(g.x, g.y);
    window.__kantel = { x: p[0], y: p[1], z: g.z, ok: true };
  }
  function aan() { window.addEventListener('devicemotion', lees, { passive: true }); }
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    var vraag = function () {
      DeviceMotionEvent.requestPermission().then(function (s) { if (s === 'granted') aan(); }).catch(function () {});
      document.removeEventListener('touchend', vraag); document.removeEventListener('click', vraag);
    };
    document.addEventListener('touchend', vraag); document.addEventListener('click', vraag);
  } else aan();
})();
</script>
<style>
#draaitip { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 22px;
  background: #1b2f4a; color: #fff; font: 700 clamp(18px, 5.5vw, 28px)/1.3 system-ui, sans-serif; text-align: center; padding: 24px; }
#draaitip .fone { width: 44px; height: 80px; border: 4px solid #fff; border-radius: 10px; box-sizing: border-box; animation: draaitip-draai 2.4s ease-in-out infinite; }
#draaitip .fone::after { content: ''; display: block; width: 18px; height: 4px; background: #fff; margin: 64px auto 0; border-radius: 2px; }
#draaitip small { font-size: 14px; font-weight: 400; opacity: .7; }
@keyframes draaitip-draai { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 600px) { #draaitip.aan { display: flex; } }
</style>
<script>
(function(){
  // Staand op een telefoon is de HUD van Godot minuscuul (art-pass 0.5): een laag die vraagt het toestel te draaien,
  // in de taal van ?taal, anders localStorage, anders de browser. Tik op de laag om toch staand te spelen.
  var T = {'bg':'Обърни телефона хоризонтално.','cs':'Otoč telefon na šířku.','da':'Drej telefonen.','de':'Dreh dein Handy quer.','el':'Γύρισε το τηλέφωνο οριζόντια.','en':'Turn your phone sideways.','es':'Gira el teléfono.','et':'Pööra telefon rõhtsaks.','fi':'Käännä puhelin vaakaan.','fr':'Tourne ton téléphone.','ga':'Cas do fhón ar a thaobh.','hr':'Okreni telefon vodoravno.','hu':'Fordítsd el a telefont.','it':'Gira il telefono.','lt':'Pasuk telefoną gulsčiai.','lv':'Pagriez telefonu horizontāli.','mt':'Dawwar it-telefon orizzontali.','pl':'Obróć telefon poziomo.','pt':'Vira o telemóvel de lado.','ro':'Întoarce telefonul pe orizontală.','sk':'Otoč telefón na šírku.','sl':'Obrni telefon ležeče.','sv':'Vänd telefonen på tvären.','nl':'Draai je telefoon dwars.'};
  function taal() {
    var t = '';
    try { t = new URLSearchParams(location.search).get('taal') || localStorage.getItem('galadin_taal') || ''; } catch (e) {}
    if (!T[t]) t = (navigator.language || 'en').slice(0, 2).toLowerCase();
    return T[t] ? t : 'en';
  }
  function maak() {
    var d = document.createElement('div'); d.id = 'draaitip'; d.className = 'aan';
    d.innerHTML = '<div class=fone></div><div>' + T[taal()] + '</div><small>&#10005;</small>';
    d.addEventListener('click', function () { d.classList.remove('aan'); });
    document.body.appendChild(d);
  }
  if (document.body) maak(); else document.addEventListener('DOMContentLoaded', maak);
})();
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":119376,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
